<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Дневник тренировок</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#000;--tx:#fff;--hint:#8e8e93;--btn:#fa114f;--btx:#fff;--card:#1c1c1e;--line:#ffffff14;--ring:#a6ff00}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px -apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",system-ui,sans-serif;padding-bottom:140px;-webkit-font-smoothing:antialiased}
main{padding:14px;max-width:560px;margin:auto}
.card{background:var(--card);border-radius:22px;padding:16px;margin-bottom:14px}
h3{margin:0 0 10px;font-size:20px;font-weight:700;letter-spacing:-.3px}
input,select{font:inherit;color:var(--tx);background:#2c2c2e;border:1px solid transparent;border-radius:14px;padding:11px 12px;min-width:0;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--btn)}
button{font:inherit;font-weight:600;border:0;border-radius:14px;padding:11px 14px;background:var(--btn);color:var(--btx);transition:transform .12s,opacity .12s}
button:active{transform:scale(.96);opacity:.85}
button.g{background:#2c2c2e;color:#fff}
.row{display:flex;gap:8px;align-items:center;margin:8px 0}
.row input{flex:1;width:0}
.hint{color:var(--hint);font-size:14px;margin:4px 0}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(28,28,30,.85);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;color:var(--hint);border-radius:0;padding:14px 0;font-size:14px;font-weight:500}
nav button.on{color:var(--btn);font-weight:700}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal div{border-radius:50%;position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.cal .h{color:var(--hint);font-size:12px;aspect-ratio:auto;border-radius:0;padding:2px}
.cal .s{background:var(--btn);color:var(--btx);font-weight:700}
.cal .t{outline:2px solid var(--btn);outline-offset:-2px}
.cal .m::after{content:"";position:absolute;bottom:3px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--ring)}
.cal .s.m::after{background:var(--btx)}
.cal .i{box-shadow:inset 0 0 0 2px var(--imp,#ffd60a);font-weight:700}
:root[data-th=d]{--bg:#000;--tx:#fff;--card:#1c1c1e;--hint:#8e8e93}
:root[data-th=l]{--bg:#f2f2f7;--tx:#000;--card:#fff;--hint:#8e8e93;--line:#0000000f}
:root[data-th=l] body{background:#f2f2f7}
:root[data-th=l] input,:root[data-th=l] select,:root[data-th=l] button.g,:root[data-th=l] textarea,:root[data-th=l] .sg{background:#eeeef0;color:#000}
:root[data-th=l] nav{background:rgba(255,255,255,.85)}
:root[data-th=l] #tm{background:rgba(255,255,255,.92)}
#tm{position:fixed;left:12px;right:12px;bottom:calc(60px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center;align-items:center;padding:8px 10px;background:rgba(44,44,46,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:20px;box-shadow:0 8px 30px #000a}
#tm:empty{display:none}
#tm button{padding:8px 12px}
textarea{font:inherit;color:var(--tx);background:#2c2c2e;border:1px solid transparent;border-radius:14px;padding:11px 12px;width:100%;min-height:70px;margin-top:8px;outline:none}
button.d{background:var(--imp,#fa114f);color:#fff}
.bd{display:inline-block;font-size:12px;font-weight:600;line-height:1;padding:4px 9px;border-radius:20px;background:hsla(var(--h),80%,55%,.2);color:hsl(var(--h),90%,68%);white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.sg{background:#2c2c2e;border-radius:14px;max-height:240px;overflow:auto;margin-bottom:8px}
.sg:empty{display:none}
.si{padding:12px;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line)}
.si:last-child{border-bottom:0}
details.grp{border-left:4px solid hsl(var(--h),85%,58%);padding-left:10px;margin:12px 0}
details.grp summary{padding:6px 0;cursor:pointer}
.wrap{flex-wrap:wrap}
</style>
</head>
<body>
<main id="app"></main>
<nav>
<button onclick="tab=0;render()">📅 Дневник</button>
<button onclick="tab=1;render()">📈 Прогресс</button>
<button onclick="tab=2;render()">👤 Профиль</button>
</nav>
<div id="tm"></div>
<script>
'use strict';
const tg=window.Telegram&&Telegram.WebApp;
if(!tg){document.getElementById('app').innerHTML='<div class="card"><h3>Откройте приложение в Telegram</h3><p class="hint">Для работы дневника требуется Telegram Mini App.</p></div>';throw new Error('Telegram WebApp is unavailable');}
tg.ready();tg.expand();try{tg.setHeaderColor('#000000');tg.setBackgroundColor('#000000')}catch(e){}
const ALLOWED=[8159404885]; // Telegram ID тех, у кого есть доступ; это только клиентская проверка
const u=tg.initDataUnsafe&&tg.initDataUnsafe.user,cs=tg.CloudStorage;
const CLOUD=!!cs&&(!tg.isVersionAtLeast||tg.isVersionAtLeast('6.9'));
const $=s=>document.querySelector(s),app=$('#app');
const DN=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const MN=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
let today=iso(new Date());
const R=x=>Math.round(x*10)/10;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(d,short)=>new Date(d+'T12:00').toLocaleDateString('ru-RU',short?{day:'numeric',month:'short'}:{weekday:'long',day:'numeric',month:'long'});
const wd=d=>(new Date(d+'T12:00').getDay()+6)%7;
const num=v=>{const n=parseFloat(String(v??'').replace(',','.'));return Number.isFinite(n)?n:0};
const S={lib:[],prog:[],days:{},bw:{},mk:{},cfg:{},n:{lib:0,pg:0}};
let tab=0,date=today,view=new Date(),pd=0,pm=0,pq='',pk=0,LE=-1,bd=today,GL=[],GO=new Set();

const nk=s=>String(s||'').toLowerCase().replace(/ё/g,'е').replace(/[^\p{L}\p{N}]+/gu,' ').trim();
const cap=s=>{s=String(s||'').trim().replace(/\s+/g,' ');return s?s.charAt(0).toUpperCase()+s.slice(1):''};
const libFind=n=>{const k=nk(n);return k?S.lib.find(e=>nk(e.n)==k):null};
function lev(a,b){
 const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);
 for(let j=1;j<=n;j++)d[0][j]=j;
 for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]==b[j-1]?0:1));
 return d[m][n];
}
function fuzzy(name){
 const k=nk(name),L=k.length;if(L<5)return null;
 const lim=L>=9?2:1;let best=null,bd=99;
 for(const e of S.lib){const d=lev(k,nk(e.n));if(d<=lim&&d<bd){bd=d;best=e}}
 return best;
}
const conf=m=>new Promise(r=>tg.showConfirm(m,r));
async function resolve(raw){
 const n=cap(raw);if(!n)return null;
 let e=libFind(n);if(e)return e;
 const f=fuzzy(n);
 if(f&&await conf('«'+n+'» похоже на «'+f.n+'». Это то же упражнение?'))return f;
 e={n,g:'',t:'',s:''};S.lib.push(e);saveLib();return e;
}
function normG(x){x=cap(x);if(!x)return '';const f=S.lib.find(e=>e.g&&nk(e.g)==nk(x));return f?f.g:x}
const groups=()=>[...new Set(S.lib.map(e=>e.g).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ru'));
const hue=g=>{let h=0;for(const c of nk(g))h=(h*31+c.charCodeAt(0))%360;return h};
const badge=g=>`<span class="bd" style="--h:${hue(g)}">${esc(g)}</span>`;
const inf=e=>e&&(e.t||e.s)?`<div class="hint">${[e.t?'🎯 '+esc(e.t):'',e.s?'🤝 '+esc(e.s):''].filter(Boolean).join(' · ')}</div>`:'';

const call=(f,...a)=>CLOUD?new Promise((ok,no)=>f.call(cs,...a,(e,v)=>e?no(e):ok(v))):Promise.resolve();
const LS={get:k=>{try{return localStorage.getItem('g_'+k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem('g_'+k,v)}catch(e){}},del:k=>{try{localStorage.removeItem('g_'+k)}catch(e){}},keys:()=>{try{return Object.keys(localStorage).filter(k=>k.startsWith('g_')).map(k=>k.slice(2))}catch(e){return[]}}};
let warned=0;
const wrap=v=>JSON.stringify({__w:1,t:Date.now(),v});
const unwrap=t=>{try{const o=JSON.parse(t);return o&&o.__w?{t:o.t||0,v:o.v}:{t:0,v:o}}catch(e){return null}};
const put=(k,v)=>{const j=wrap(v);LS.set(k,j);return call(cs&&cs.setItem,k,j).catch(e=>{if(!warned++)tg.showAlert('Облако Telegram не приняло запись ('+(e&&e.message||e)+'). Данные сохранены на этом телефоне.')})};
const del=k=>{LS.del(k);return call(cs&&cs.removeItem,k).catch(()=>{})};
function saveChunks(pre,arr,old){
 const parts=[];let cur=[];
 for(const it of arr){cur.push(it);if(cur.length>1&&JSON.stringify(cur).length>1500){cur.pop();parts.push(cur);cur=[it]}}
 if(cur.length)parts.push(cur);
 parts.forEach((p,i)=>put(pre+i,p));
 for(let i=parts.length;i<old;i++)del(pre+i);
 return parts.length;
}
const saveLib=()=>{S.n.lib=saveChunks('lib_',S.lib,S.n.lib)};
const savePg=()=>{S.n.pg=saveChunks('pg_',S.prog,S.n.pg)};
async function load(){
 let ck=[];if(CLOUD){try{ck=await call(cs.getKeys)||[]}catch(e){}}
 const keys=[...new Set([...ck,...LS.keys()])],raw={};
 for(let i=0;i<keys.length;i+=50){
  const part=keys.slice(i,i+50);let r={};
  if(CLOUD){try{r=await call(cs.getItems,part)||{}}catch(e){}}
  for(const k of part){const a=LS.get(k)?unwrap(LS.get(k)):null,b=r[k]?unwrap(r[k]):null,x=a&&b?(b.t>a.t?b:a):(a||b);if(x)raw[k]=x.v}
 }
 const ch={lib:[],pg:[]};let oldLib=null,oldProg=null,m;
 for(const k in raw){
  const v=raw[k];
  if(k=='lib')oldLib=v;else if(k=='prog')oldProg=v;
  else if(m=k.match(/^lib_(\d+)$/))ch.lib[+m[1]]=v;
  else if(m=k.match(/^pg_(\d+)$/))ch.pg[+m[1]]=v;
  else if(k.startsWith('d_')&&Array.isArray(v))S.days[k.slice(2)]=v;
  else if(k.startsWith('bw_')&&v&&typeof v==='object')Object.assign(S.bw,v);
  else if(k.startsWith('m_')&&v&&typeof v==='object')Object.assign(S.mk,v);
  else if(k=='cfg'&&v&&typeof v==='object')S.cfg=v;
 }
 S.lib=ch.lib.filter(Boolean).flat();S.n.lib=ch.lib.length;
 S.prog=ch.pg.filter(Boolean).flat();S.n.pg=ch.pg.length;
 if(!S.lib.length&&Array.isArray(oldLib)){S.lib=oldLib.map(n=>({n:cap(n),g:'',t:'',s:''}));saveLib();del('lib')}
 if(!S.prog.length&&oldProg&&typeof oldProg=='object'&&!Array.isArray(oldProg)){
  for(let i=0;i<7;i++)if(oldProg[i]&&oldProg[i].length)S.prog.push({n:DN[i],ex:oldProg[i]});
  savePg();del('prog');
 }
 if(!S.cfg.mig)migrate();
}
function migrate(){
 const m=new Map();
 for(const e of S.lib){if(!e||typeof e!=='object')continue;const k=nk(e.n);if(!k)continue;const o=m.get(k);if(!o)m.set(k,{n:cap(e.n),g:e.g||'',t:e.t||'',s:e.s||''});else{o.g=o.g||e.g||'';o.t=o.t||e.t||'';o.s=o.s||e.s||''}}
 S.lib=[...m.values()];
 for(const d in S.days){
  if(!Array.isArray(S.days[d])){delete S.days[d];continue}
  let c=0;S.days[d].forEach(e=>{if(!e||typeof e!=='object'||!Array.isArray(e.s))return;let l=libFind(e.n);if(!l){l={n:cap(e.n),g:'',t:'',s:''};if(l.n)S.lib.push(l)}if(l.n!==e.n){e.n=l.n;c=1}});
  if(c)put('d_'+d,S.days[d]);
 }
 S.prog=S.prog.filter(p=>p&&typeof p==='object'&&Array.isArray(p.ex));
 S.prog.forEach(p=>p.ex.forEach(x=>{const l=libFind(x.n);if(l)x.n=l.n}));
 saveLib();savePg();S.cfg.mig=1;put('cfg',S.cfg);
}
function saveDay(k){k=k||date;const d=S.days[k];if(d&&d.length)put('d_'+k,d);else{delete S.days[k];del('d_'+k)}}
function saveBwM(m){const o={};for(const k in S.bw)if(k.startsWith(m))o[k]=S.bw[k];if(Object.keys(o).length)put('bw_'+m,o);else del('bw_'+m)}
function saveMkM(m){const o={};for(const k in S.mk)if(k.startsWith(m))o[k]=S.mk[k];if(Object.keys(o).length)put('m_'+m,o)}

function chart(p){
 if(p.length<2)return `<p class="hint">${p.length?'Одна запись: '+R(p[0][1])+'. ':''}Для графика нужно минимум две записи.</p>`;
 const W=320,H=160,P=30,v=p.map(x=>x[1]),lo=Math.min(...v),hi=Math.max(...v),r=hi-lo||1;
 const X=i=>P+i*(W-P-10)/(p.length-1),Y=y=>H-22-(y-lo)/r*(H-44);
 return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="margin-top:8px"><polyline fill="none" stroke="var(--btn)" stroke-width="2" points="${p.map((x,i)=>X(i)+','+Y(x[1])).join(' ')}"/>`+p.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x[1])}" r="3" fill="var(--btn)"/>`).join('')+`<g fill="var(--hint)" font-size="11"><text x="0" y="${Y(hi)+4}">${R(hi)}</text><text x="0" y="${Y(lo)+4}">${R(lo)}</text><text x="${P}" y="${H-4}">${fmt(p[0][0],1)}</text><text x="${W-10}" y="${H-4}" text-anchor="end">${fmt(p[p.length-1][0],1)}</text></g></svg>`;
}

let SG=[],SGM='add';
function sug(id,box,mode){
 const el=$('#'+id),b=$('#'+box);if(!el||!b)return;
 const val=el.value,q=nk(val);SGM=mode;if(!q){b.innerHTML='';SG=[];return}
 const hit=S.lib.filter(e=>nk(e.n).includes(q)||nk(e.g).includes(q)).sort((a,c)=>(nk(a.n).startsWith(q)?0:1)-(nk(c.n).startsWith(q)?0:1)||a.n.localeCompare(c.n,'ru'));
 const f=fuzzy(val),list=[...(f&&!hit.includes(f)?[f]:[]),...hit].slice(0,30);SG=list.map(e=>e.n);
 let h=list.map((e,i)=>`<div class="si" onclick="pickS(${i},'${id}','${box}')"><span style="flex:1">${f&&e===f&&!hit.includes(e)?'Возможно: ':''}${esc(e.n)}</span>${e.g?badge(e.g):''}</div>`).join('');
 if(!libFind(val))h+=`<div class="si" onclick="pickNew('${id}','${box}')"><span style="flex:1">➕ Новое: «${esc(cap(val))}»</span></div>`;
 b.innerHTML=h;
}
function pickS(i,id,box){const n=SG[i];$('#'+box).innerHTML='';if(SGM=='fill')$('#'+id).value=n;else addEx(n)}
function pickNew(id,box){const v=$('#'+id).value;$('#'+box).innerHTML='';if(SGM=='fill')$('#'+id).value=cap(v);else addEx(v)}

function cal(){
 const y=view.getFullYear(),m=view.getMonth(),first=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate();
 let h=`<div class="row"><button class="g" onclick="mv(-1)">‹</button><b style="flex:1;text-align:center">${MN[m]} ${y}</b><button class="g" onclick="mv(1)">›</button></div><div class="cal">`+DN.map(x=>`<div class="h">${x}</div>`).join('')+'<div></div>'.repeat(first);
 for(let i=1;i<=n;i++){const k=iso(new Date(y,m,i));h+=`<div class="${k==date?'s ':''}${S.days[k]?'m ':''}${S.mk[k]&&S.mk[k].i?'i ':''}${k==today?'t':''}" onclick="pick('${k}')">${i}</div>`}
 return `<div class="card">${h}</div>`;
}
const mv=d=>{view=new Date(view.getFullYear(),view.getMonth()+d,1);render()};
const pick=k=>{date=k;pk=0;render()};

function progBlock(){
 const P=S.prog;if(!P.length)return '<p class="hint">Программы пока нет. Создайте её во вкладке «Профиль».</p>';
 const nx=(S.cfg.nx||0)%P.length;
 if(pk)return `<div class="hint">Какой день программы внести?</div>`+P.map((x,i)=>`<button class="${i==nx?'':'g'}" style="width:100%;margin-top:6px" onclick="applyProg(${i})">${i+1}. ${esc(x.n)}${i==nx?' (следующий)':''}</button>`).join('')+`<button class="g" style="width:100%;margin-top:6px" onclick="pk=0;render()">Отмена</button>`;
 return `<button style="width:100%" onclick="applyProg(${nx})">Внести: ${esc(P[nx].n)}</button>`+(P.length>1?`<button class="g" style="width:100%;margin-top:6px" onclick="pk=1;render()">Другой день программы…</button>`:'');
}
function day(){
 const d=S.days[date]||[],mk=S.mk[date]||{},gs=[...new Set(d.map(e=>(libFind(e.n)||{}).g).filter(Boolean))];
 return `<div class="card"><h3>${fmt(date)}</h3>`+(gs.length?`<div class="chips">${gs.map(badge).join('')}</div>`:'')+
 d.map((e,i)=>{const l=libFind(e.n),sets=Array.isArray(e.s)?e.s:[];return `<div style="margin:12px 0"><div class="row"><b style="flex:1">${esc(e.n)}</b><button class="g" onclick="ask(()=>rmEx(${i}))">✕</button></div>${inf(l)}`+
 sets.map((s,j)=>`<div class="row"><span class="hint" style="width:18px">${j+1}</span><input type="text" inputmode="decimal" value="${esc(s[0])}" onchange="setv(${i},${j},0,this.value)"><span>кг ×</span><input type="text" inputmode="numeric" value="${esc(s[1])}" onchange="setv(${i},${j},1,this.value)"><button class="g" onclick="ask(()=>rmSet(${i},${j}))">−</button></div>`).join('')+
 `<button class="g" onclick="addSet(${i})">+ подход</button></div>`}).join('')+
 (d.length?'':'<p class="hint">В этот день записей нет.</p>')+
 `<div class="row"><input id="ex" placeholder="Упражнение или группа мышц" autocomplete="off" oninput="sug('ex','sgx','add')" onkeydown="if(event.key=='Enter')addEx(this.value)"><button onclick="addEx($('#ex').value)">Добавить</button></div><div id="sgx" class="sg"></div><div style="margin-top:10px">${progBlock()}</div>`+
 (d.length?`<button class="d" style="width:100%;margin-top:8px" onclick="ask(()=>rmDay())">Удалить тренировку дня</button>`:'')+`</div>`+
 `<div class="card"><h3>Заметка</h3><button class="${mk.i?'d':'g'}" onclick="togImp()">${mk.i?'⭐ Важная тренировка':'☆ Отметить важной'}</button><textarea placeholder="Заметка к этому дню" onchange="setNote(this.value)">${esc(mk.t||'')}</textarea></div>`;
}
const prev=n=>{const k=nk(n);for(const x of Object.keys(S.days).filter(x=>x<date).sort().reverse()){const e=S.days[x].find(e=>nk(e.n)==k);if(e&&Array.isArray(e.s)&&e.s.length)return [...e.s[e.s.length-1]]}return [0,0]};
function setv(i,j,k,v){if(!S.days[date]?.[i]?.s?.[j])return;S.days[date][i].s[j][k]=num(v);saveDay()}
function addSet(i){const s=S.days[date][i].s;s.push(s.length?[...s[s.length-1]]:[0,0]);saveDay();render()}
function rmSet(i,j){const e=S.days[date][i];e.s.splice(j,1);if(!e.s.length)S.days[date].splice(i,1);saveDay();render()}
function rmEx(i){S.days[date].splice(i,1);saveDay();render()}
async function addEx(raw){
 const e=await resolve(raw);if(!e)return;const d=S.days[date]||[];
 if(d.some(x=>nk(x.n)==nk(e.n))){tg.showAlert('«'+e.n+'» уже есть в этом дне. Добавьте подход кнопкой «+ подход».');return}
 S.days[date]=d;d.push({n:e.n,s:[prev(e.n)]});saveDay();render();
}
function applyProg(i){
 const p=S.prog[i];if(!p||!p.ex.length){tg.showAlert('В этом дне программы нет упражнений. Заполните её во вкладке «Профиль».');return}
 const d=S.days[date]=S.days[date]||[];let added=0;
 p.ex.forEach(x=>{const l=libFind(x.n),n=l?l.n:x.n;if(d.some(e=>nk(e.n)==nk(n)))return;const w=prev(n)[0]||x.w||0;d.push({n,s:Array.from({length:Math.max(1,Math.min(30,Math.round(num(x.s))||3))},()=>[w,Math.max(0,num(x.r)||10)])});added++});
 S.cfg.nx=(i+1)%S.prog.length;put('cfg',S.cfg);pk=0;saveDay();render();if(!added)tg.showAlert('Все упражнения этого дня уже внесены.');
}

function prog(){
 const m=new Map();
 Object.values(S.days).flat().forEach(e=>{if(!e||!e.n)return;const k=nk(e.n);if(!m.has(k)){const l=libFind(e.n);m.set(k,{k,n:l?l.n:e.n,g:l?l.g:'',l})}});
 if(!m.size)return '<div class="card"><h3>Прогресс</h3><p class="hint">Пока нет данных. Запишите тренировку во вкладке «Дневник».</p></div>';
 const list=[...m.values()],G={};list.forEach(x=>(G[x.g]=G[x.g]||[]).push(x));
 const gk=Object.keys(G).sort((a,b)=>(!a-!b)||a.localeCompare(b,'ru'));
 if(!m.has(pq))pq='';
 const cur=m.get(pq)||G[gk[0]].sort((a,b)=>a.n.localeCompare(b.n,'ru'))[0];
 const pts=Object.keys(S.days).sort().map(k=>{
  const sets=S.days[k].filter(e=>nk(e.n)==cur.k).flatMap(e=>Array.isArray(e.s)?e.s:[]).filter(s=>Array.isArray(s)&&s.length>=2);
  if(!sets.length)return null;
  return [k,pm==1?sets.reduce((a,s)=>a+num(s[0])*num(s[1]),0):pm==2?Math.max(...sets.map(s=>num(s[0])*(1+num(s[1])/30))):Math.max(...sets.map(s=>num(s[0])))];
 }).filter(Boolean);
 const best=pts.length?R(Math.max(...pts.map(p=>p[1]))):'Нет данных';
 return `<div class="card"><h3>Прогресс</h3><div class="row"><select style="flex:1" onchange="pq=this.value;render()">${gk.map(g=>`<optgroup label="${esc(g||'Без группы')}">`+G[g].sort((a,b)=>a.n.localeCompare(b.n,'ru')).map(x=>`<option value="${esc(x.k)}" ${x.k==cur.k?'selected':''}>${esc(x.n)}</option>`).join('')+'</optgroup>').join('')}</select><select onchange="pm=+this.value;render()">${['Макс. вес','Объём','1ПМ (расч.)'].map((x,i)=>`<option value="${i}" ${pm==i?'selected':''}>${x}</option>`).join('')}</select></div>${cur.g?`<div class="chips">${badge(cur.g)}</div>`:''}${inf(cur.l)}${chart(pts)}<p class="hint">${['Максимальный вес за тренировку, кг.','Объём = сумма (вес × повторы) за тренировку.','Расчётный максимум на 1 повтор (формула Эпли).'][pm]} Тренировок: ${pts.length}. Лучший результат: ${best}</p></div>`+bars();
}

function progCard(){
 const P=S.prog;if(pd>=P.length)pd=Math.max(0,P.length-1);
 let h=`<div class="card"><h3>Моя программа</h3>`;
 if(!P.length){h+=`<p class="hint">Выберите шаблон сплита или создайте свой. Дни можно переименовывать, добавлять и удалять.</p><div class="row"><button style="flex:1" onclick="tpl(3)">Сплит на 3 дня</button><button style="flex:1" onclick="tpl(4)">Сплит на 4 дня</button></div><button class="g" style="width:100%" onclick="addDay()">Своя программа</button></div>`;return h}
 h+=`<div class="row wrap">`+P.map((x,i)=>`<button class="${i==pd?'':'g'}" onclick="pd=${i};render()">${i+1}. ${esc(x.n)}</button>`).join('')+(P.length<7?`<button class="g" onclick="addDay()">＋ день</button>`:'')+`</div>`;
 const p=P[pd];h+=`<div class="row"><input value="${esc(p.n)}" onchange="renDay(this.value)" placeholder="Название дня"><button class="g" onclick="ask(()=>rmPDay())">Удалить день</button></div>`;
 p.ex.forEach((x,i)=>{const l=libFind(x.n);h+=`<div class="row"><div style="flex:1"><div>${esc(x.n)}: ${x.s}×${x.r}${x.w?', '+x.w+' кг':''} ${l&&l.g?badge(l.g):''}</div>${inf(l)}</div><button class="g" onclick="ask(()=>rmP(${i}))">✕</button></div>`});
 if(!p.ex.length)h+=`<p class="hint">В этом дне пока нет упражнений.</p>`;
 h+=`<div class="row"><input id="pn" placeholder="Упражнение или группа мышц" autocomplete="off" oninput="sug('pn','sgp','fill')"></div><div id="sgp" class="sg"></div><div class="row"><input id="ps" type="text" inputmode="numeric" placeholder="подходов"><input id="pr" type="text" inputmode="numeric" placeholder="повторов"><input id="pw" type="text" inputmode="decimal" placeholder="кг"><button onclick="addP()">+</button></div></div>`;
 return h;
}
const TPL={3:['Грудь + трицепс','Спина + бицепс','Ноги + плечи'],4:['Руки','Ноги + плечи','Спина + бицепс','Грудь + трицепс']};
function tpl(n){S.prog=TPL[n].map(x=>({n:x,ex:[]}));pd=0;savePg();render()}
function addDay(){if(S.prog.length>=7){tg.showAlert('Можно создать не более 7 дней программы.');return}S.prog.push({n:'День '+(S.prog.length+1),ex:[]});pd=S.prog.length-1;savePg();render()}
function renDay(v){S.prog[pd].n=cap(v)||S.prog[pd].n;savePg();render()}
function rmPDay(){S.prog.splice(pd,1);S.cfg.nx=0;put('cfg',S.cfg);savePg();render()}
async function addP(){
 const e=await resolve($('#pn').value);if(!e)return;const p=S.prog[pd];
 if(p.ex.some(x=>nk(x.n)==nk(e.n))){tg.showAlert('«'+e.n+'» уже есть в этом дне программы.');return}
 p.ex.push({n:e.n,s:Math.max(1,Math.min(30,Math.round(num($('#ps').value))||3)),r:Math.max(1,Math.min(500,Math.round(num($('#pr').value))||10)),w:Math.max(0,num($('#pw').value))});
 savePg();render();
}
function rmP(i){S.prog[pd].ex.splice(i,1);savePg();render()}

function libCard(){
 const G={};S.lib.forEach((e,i)=>(G[e.g||'']=G[e.g||'']||[]).push(i));GL=Object.keys(G).sort((a,b)=>(!a-!b)||a.localeCompare(b,'ru'));
 const ed=LE>=0&&S.lib[LE]?S.lib[LE]:{n:'',g:'',t:'',s:''},editing=LE>=0&&S.lib[LE];
 let h=`<div class="card"><h3>Библиотека упражнений</h3><div id="lf"><div class="hint">${editing?'Редактирование':'Новое упражнение'}</div><div class="row"><input id="lfn" placeholder="Название" value="${esc(ed.n)}"></div><div class="row"><input id="lfg" list="grp" placeholder="Группа мышц (например, Спина)" value="${esc(ed.g)}"></div><div class="row"><input id="lft" placeholder="Целевые мышцы" value="${esc(ed.t)}"></div><div class="row"><input id="lfs" placeholder="Синергисты" value="${esc(ed.s)}"></div><div class="row"><button style="flex:1" onclick="saveLibEx()">${editing?'Сохранить':'Добавить'}</button>${editing?'<button class="g" onclick="LE=-1;render()">Отмена</button>':''}</div></div>`;
 h+=GL.length?GL.map((g,gi)=>{const ids=G[g].sort((a,b)=>S.lib[a].n.localeCompare(S.lib[b].n,'ru'));return `<details class="grp" style="${g?'--h:'+hue(g):'border-left-color:#8886'}" ${GO.has(g)?'open':''} ontoggle="gt(this,${gi})"><summary><b>${g?esc(g):'Без группы'}</b> <span class="hint">· ${ids.length}</span></summary>`+ids.map(i=>{const e=S.lib[i];return `<div class="row"><div style="flex:1"><div>${esc(e.n)}</div>${inf(e)}</div><button class="g" onclick="editLib(${i})">✎</button><button class="g" onclick="ask(()=>rmL(${i}))">✕</button></div>`}).join('')+`</details>`}).join(''):'<p class="hint">Пока пусто. Упражнения появляются здесь, когда вы их добавляете.</p>';
 return h+`</div>`;
}
const gt=(el,gi)=>{const g=GL[gi];if(el.open)GO.add(g);else GO.delete(g)};
function editLib(i){LE=i;render();$('#lf').scrollIntoView({behavior:'smooth'})}
function rmL(i){S.lib.splice(i,1);LE=-1;saveLib();render()}
function saveLibEx(){
 const n=cap($('#lfn').value);if(!n){tg.showAlert('Введите название упражнения.');return}
 const g=normG($('#lfg').value),t=$('#lft').value.trim(),s=$('#lfs').value.trim(),dup=S.lib.findIndex((e,i)=>i!=LE&&nk(e.n)==nk(n));
 if(dup>=0){tg.showAlert('Такое упражнение уже есть: «'+S.lib[dup].n+'».');return}
 if(LE>=0&&S.lib[LE]){const o=S.lib[LE].n;Object.assign(S.lib[LE],{n,g,t,s});if(o!==n)renameEverywhere(o,n)}else S.lib.push({n,g,t,s});
 if(g)GO.add(g);LE=-1;saveLib();render();
}
function renameEverywhere(o,n){
 const k=nk(o);for(const d in S.days){let c=0;S.days[d].forEach(e=>{if(nk(e.n)==k){e.n=n;c=1}});if(c)put('d_'+d,S.days[d])}
 let c=0;S.prog.forEach(p=>p.ex.forEach(x=>{if(nk(x.n)==k){x.n=n;c=1}}));if(c)savePg();
}

function bwCard(){
 const ks=Object.keys(S.bw).sort(),pts=ks.map(k=>[k,S.bw[k]]),L=pts[pts.length-1];
 return `<div class="card"><h3>Вес тела</h3><div class="row"><input id="bwd" type="date" value="${bd}" style="flex:none;width:150px"><input id="bw" type="text" inputmode="decimal" placeholder="кг"><button onclick="addBw()">Записать</button></div>${chart(pts.slice(-30))}`+(L?`<p class="hint">Последняя запись: ${R(L[1])} кг (${fmt(L[0],1)})</p>`:'')+ks.slice(-5).reverse().map(k=>`<div class="row"><span style="flex:1">${fmt(k,1)}: ${R(S.bw[k])} кг</span><button class="g" onclick="ask(()=>rmBw('${k}'))">✕</button></div>`).join('')+`</div>`;
}
function addBw(){const d=$('#bwd').value||today,v=num($('#bw').value);if(!v||v<0){tg.showAlert('Введите корректное значение.');return}S.bw[d]=v;bd=d;saveBwM(d.slice(0,7));render()}
function rmBw(k){delete S.bw[k];saveBwM(k.slice(0,7));render()}
function prof(){
 let h=bwCard()+progCard()+libCard();
 h+=`<div class="card"><h3>Оформление</h3><div class="row"><span style="flex:1">Тема</span><select onchange="cfg('th',this.value)">${[['','Как в Telegram'],['l','Светлая'],['d','Тёмная']].map(x=>`<option value="${x[0]}" ${(S.cfg.th||'')==x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></div><div class="row"><span style="flex:1">Основной цвет</span><input type="color" style="flex:none;width:56px;height:36px;padding:2px" value="${S.cfg.a||'#fa114f'}" onchange="cfg('a',this.value)"></div><div class="row"><span style="flex:1">Цвет важных тренировок</span><input type="color" style="flex:none;width:56px;height:36px;padding:2px" value="${S.cfg.i||'#e5484d'}" onchange="cfg('i',this.value)"></div><button class="g" onclick="resetTheme()">Сбросить цвета</button></div>`;
 h+=`<div class="card"><h3>Резервная копия</h3><p class="hint">Экспорт кладёт все данные в поле ниже и в буфер обмена. Импорт заменяет текущие данные тем, что вставлено в поле.</p><div class="row"><button class="g" style="flex:1" onclick="exportData()">Экспорт</button><button class="g" style="flex:1" onclick="importData()">Импорт</button></div><textarea id="bk" placeholder="Здесь появится копия, или вставьте её для импорта"></textarea><p class="hint">Версия 4</p></div>`;
 return h;
}
const months=o=>[...new Set(Object.keys(o).map(k=>k.slice(0,7)))];
function exportData(){const t=JSON.stringify({v:4,lib:S.lib,prog:S.prog,days:S.days,bw:S.bw,mk:S.mk,cfg:S.cfg}),b=$('#bk');b.value=t;b.select();try{navigator.clipboard.writeText(t).then(()=>tg.showAlert('Копия скопирована в буфер.'),()=>tg.showAlert('Скопируйте текст из поля вручную.'))}catch(e){tg.showAlert('Скопируйте текст из поля вручную.')}}
function validBackup(o){
 if(!o||typeof o!=='object'||Array.isArray(o)||!o.days||typeof o.days!=='object'||Array.isArray(o.days))return false;
 if(o.lib!==undefined&&(!Array.isArray(o.lib)||!o.lib.every(x=>typeof x==='string'||(x&&typeof x==='object'&&typeof x.n==='string'))))return false;
 if(o.prog!==undefined&&(!Array.isArray(o.prog)||!o.prog.every(p=>p&&typeof p.n==='string'&&Array.isArray(p.ex))))return false;
 if(o.bw!==undefined&&(!o.bw||typeof o.bw!=='object'||Array.isArray(o.bw)))return false;
 if(o.mk!==undefined&&(!o.mk||typeof o.mk!=='object'||Array.isArray(o.mk)))return false;
 if(!Object.values(o.days).every(d=>Array.isArray(d)&&d.every(e=>e&&typeof e.n==='string'&&Array.isArray(e.s)&&e.s.every(s=>Array.isArray(s)&&s.length>=2))))return false;
 return true;
}
async function importData(){
 let o;try{o=JSON.parse($('#bk').value)}catch(e){tg.showAlert('Не удалось прочитать копию.');return}
 if(!validBackup(o)){tg.showAlert('Структура копии повреждена или не поддерживается. Текущие данные не изменены.');return}
 if(!await conf('Заменить все текущие данные данными из копии?'))return;
 const old={d:Object.keys(S.days),b:months(S.bw),m:months(S.mk)};
 S.lib=(o.lib||[]).map(x=>typeof x=='string'?{n:cap(x),g:'',t:'',s:''}:{n:cap(x.n),g:String(x.g||''),t:String(x.t||''),s:String(x.s||'')});
 S.prog=(o.prog||[]).map(p=>({n:cap(p.n),ex:p.ex.map(x=>({n:cap(x.n),s:Math.max(1,Math.min(30,Math.round(num(x.s))||3)),r:Math.max(1,Math.round(num(x.r))||10),w:Math.max(0,num(x.w))}))}));
 S.days=o.days||{};S.bw=o.bw||{};S.mk=o.mk||{};S.cfg=o.cfg&&typeof o.cfg==='object'?o.cfg:{};S.cfg.mig=1;
 old.d.forEach(k=>del('d_'+k));old.b.forEach(m=>del('bw_'+m));old.m.forEach(m=>del('m_'+m));
 Object.keys(S.days).forEach(k=>put('d_'+k,S.days[k]));months(S.bw).forEach(saveBwM);months(S.mk).forEach(saveMkM);
 saveLib();savePg();put('cfg',S.cfg);theme();render();
}

const ask=f=>tg.showConfirm('Удалить?',a=>a&&f());
function rmDay(){S.days[date]=[];saveDay();render()}
const plus=n=>{const x=new Date(today+'T12:00');x.setDate(x.getDate()+n);return iso(x)};
function soon(){return [0,1,2].map(n=>[n,plus(n)]).filter(([n,k])=>S.mk[k]&&S.mk[k].i).map(([n,k])=>`<div class="card" style="border-left:4px solid var(--imp,#e5484d)"><b>⭐ ${n?'Через '+n+' '+(n==1?'день':'дня'):'Сегодня'}: важная тренировка</b><div class="hint">${fmt(k,1)}${S.mk[k].t?'. '+esc(S.mk[k].t):''}</div></div>`).join('')}
const saveMk=()=>saveMkM(date.slice(0,7));
function togImp(){const m=S.mk[date]=S.mk[date]||{};m.i=m.i?0:1;if(!m.i&&!m.t)delete S.mk[date];saveMk();render()}
function setNote(v){const m=S.mk[date]=S.mk[date]||{};m.t=v.trim();if(!m.i&&!m.t)delete S.mk[date];saveMk()}
function cfg(k,v){S.cfg[k]=v;put('cfg',S.cfg);theme();render()}
function resetTheme(){delete S.cfg.th;delete S.cfg.a;delete S.cfg.i;put('cfg',S.cfg);theme();render()}
function theme(){
 const c=S.cfg,r=document.documentElement,set=(n,v)=>v?r.style.setProperty(n,v):r.style.removeProperty(n);
 r.dataset.th=c.th||'';set('--btn',c.a);set('--imp',c.i);
 if(c.a){const n=parseInt(c.a.slice(1),16);set('--btx',((n>>16)*299+((n>>8)&255)*587+(n&255)*114)/1000>150?'#000':'#fff')}else set('--btx','');
}
function bars(){
 const mon=d=>{const x=new Date(d+'T12:00');x.setDate(x.getDate()-wd(d));return iso(x)},w=[];let c=mon(today);
 for(let i=0;i<8;i++){w.unshift(c);const x=new Date(c+'T12:00');x.setDate(x.getDate()-7);c=iso(x)}
 const n=w.map(s=>Object.keys(S.days).filter(k=>mon(k)==s&&S.days[k]?.length).length),mx=Math.max(...n,1);
 return `<div class="card"><h3>Тренировок в неделю</h3><svg viewBox="0 0 320 110" width="100%">`+n.map((v,i)=>`<rect x="${i*40+8}" y="${90-v/mx*60}" width="24" height="${v/mx*60}" rx="4" fill="var(--btn)"/><text x="${i*40+20}" y="${84-v/mx*60}" text-anchor="middle" font-size="11" fill="var(--tx)">${v}</text><text x="${i*40+20}" y="104" text-anchor="middle" font-size="10" fill="var(--hint)">${fmt(w[i],1)}</text>`).join('')+`</svg><p class="hint">Последние 8 недель.</p></div>`;
}
let tEnd=0,tInt;
function tmr(s){tEnd=s?Date.now()+s*1000:0;clearInterval(tInt);if(s)tInt=setInterval(tick,250);tick()}
function tick(){
 const left=Math.ceil((tEnd-Date.now())/1000);
 if(tEnd&&left<=0){tEnd=0;clearInterval(tInt);try{tg.HapticFeedback.notificationOccurred('success')}catch(e){};if(navigator.vibrate)navigator.vibrate([300,150,300]);tg.showAlert('Отдых закончен, пора на следующий подход!')}
 $('#tm').innerHTML=tEnd?`<b style="font-size:20px">⏱ ${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}</b><button class="g" onclick="tmr(0)">Стоп</button>`:'<span class="hint">⏱ Отдых:</span>'+[60,90,120,180].map(s=>`<button class="g" onclick="tmr(${s})">${s>=120?s/60+' мин':s+' с'}</button>`).join('');
}
function render(){
 app.innerHTML=[()=>soon()+cal()+day(),prog,prof][tab]()+`<datalist id="grp">${groups().map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`;
 document.querySelectorAll('nav button').forEach((b,i)=>b.classList.toggle('on',i==tab));
}
(async()=>{
 if(!u||!ALLOWED.includes(u.id)){app.innerHTML='<div class="card"><h3>Доступ закрыт</h3><p class="hint">Это личный дневник. Откройте его из своего бота в Telegram.</p></div>';return}
 try{await load()}catch(e){console.error(e);app.innerHTML='<div class="card"><h3>Не удалось загрузить данные</h3><p class="hint">Обновите Telegram и откройте приложение снова.</p></div>';return}
 theme();render();tick();
 setInterval(()=>{const t=iso(new Date());if(t!=today){const w=date==today;today=t;if(w)date=t;view=new Date();render()}},60000);
})();
</script>
</body>
</html>
