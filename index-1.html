<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Дневник тренировок</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:var(--tg-theme-bg-color,#fff);--tx:var(--tg-theme-text-color,#111);--hint:var(--tg-theme-hint-color,#888);--btn:var(--tg-theme-button-color,#2481cc);--btx:var(--tg-theme-button-text-color,#fff);--card:var(--tg-theme-secondary-bg-color,#f1f1f4)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif;padding-bottom:128px}
main{padding:12px;max-width:560px;margin:auto}
.card{background:var(--card);border-radius:14px;padding:12px;margin-bottom:12px}
h3{margin:0 0 8px;font-size:17px}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid #8884;border-radius:10px;padding:8px;min-width:0}
button{font:inherit;border:0;border-radius:10px;padding:9px 12px;background:var(--btn);color:var(--btx)}
button.g{background:#8883;color:var(--tx)}
.row{display:flex;gap:6px;align-items:center;margin:6px 0}
.row input{flex:1;width:0}
.hint{color:var(--hint);font-size:14px;margin:4px 0}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;color:var(--hint);border-radius:0;padding:14px 0}
nav button.on{color:var(--btn);font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.cal div{padding:8px 0;border-radius:8px;position:relative}
.cal .h{color:var(--hint);font-size:12px;padding:2px}
.cal .s{background:var(--btn);color:var(--btx)}
.cal .t{outline:1px solid var(--btn)}
.cal .m::after{content:"";position:absolute;bottom:2px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:2px;background:var(--btn)}
.cal .s.m::after{background:var(--btx)}
.cal .i{box-shadow:inset 0 0 0 2px var(--imp,#e5484d);font-weight:700}
:root[data-th=d]{--bg:#0f1115;--tx:#eceef2;--card:#1b1e26;--hint:#8c93a3}
:root[data-th=l]{--bg:#fff;--tx:#111;--card:#f1f1f4;--hint:#888}
#tm{position:fixed;left:0;right:0;bottom:calc(50px + env(safe-area-inset-bottom));display:flex;gap:6px;justify-content:center;align-items:center;padding:6px;background:var(--card);border-top:1px solid #8883}
#tm:empty{display:none}
#tm button{padding:6px 10px}
textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid #8884;border-radius:10px;padding:8px;width:100%;min-height:60px;margin-top:8px}
button.d{background:var(--imp,#e5484d);color:#fff}
</style></head>
<body>
<main id="app"></main>
<nav>
<button onclick="tab=0;render()">📅 Дневник</button>
<button onclick="tab=1;render()">📈 Прогресс</button>
<button onclick="tab=2;render()">👤 Профиль</button>
</nav>
<div id="tm"></div>
<script>
const tg=Telegram.WebApp;tg.ready();tg.expand();
const ALLOWED=[8159404885]; // Telegram ID тех, у кого есть доступ (ваш и друзей через запятую)
const u=tg.initDataUnsafe&&tg.initDataUnsafe.user, cs=tg.CloudStorage;
const $=s=>document.querySelector(s), app=$('#app');
const DN=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const MN=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=iso(new Date()), R=x=>Math.round(x*10)/10;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=(d,short)=>new Date(d+'T12:00').toLocaleDateString('ru-RU',short?{day:'numeric',month:'short'}:{weekday:'long',day:'numeric',month:'long'});
const wd=d=>(new Date(d+'T12:00').getDay()+6)%7;
const num=v=>parseFloat(String(v).replace(',','.'))||0;
const S={lib:[],prog:{},days:{},bw:{},mk:{},cfg:{}};
let tab=0,date=today,view=new Date(),pe=0,pm=0,pd=0;

/* ---------- хранилище (облако Telegram) ---------- */
const call=(f,...a)=>new Promise((ok,no)=>f.call(cs,...a,(e,v)=>e?no(e):ok(v)));
const put=(k,v)=>call(cs.setItem,k,JSON.stringify(v)).catch(()=>tg.showAlert('Не удалось сохранить'));
async function load(){
  const keys=await call(cs.getKeys);
  for(let i=0;i<keys.length;i+=50){
    const part=keys.slice(i,i+50), r=await call(cs.getItems,part);
    for(const k of part){
      if(!r[k])continue; const v=JSON.parse(r[k]);
      if(k=='lib')S.lib=v; else if(k=='prog')S.prog=v;
      else if(k.startsWith('d:'))S.days[k.slice(2)]=v;
      else if(k.startsWith('bw:'))Object.assign(S.bw,v);
      else if(k.startsWith('m:'))Object.assign(S.mk,v);
      else if(k=='cfg')S.cfg=v;
    }
  }
}
function saveDay(){
  const d=S.days[date];
  if(d&&d.length)put('d:'+date,d);
  else{delete S.days[date];call(cs.removeItem,'d:'+date)}
}

/* ---------- график ---------- */
function chart(p){
  if(p.length<2)return `<p class="hint">${p.length?'Одна запись: '+R(p[0][1])+'. ':''}Для графика нужно минимум две записи.</p>`;
  const W=320,H=160,P=30,v=p.map(x=>x[1]),lo=Math.min(...v),hi=Math.max(...v),r=hi-lo||1;
  const X=i=>P+i*(W-P-10)/(p.length-1), Y=y=>H-22-(y-lo)/r*(H-44);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="margin-top:8px"><polyline fill="none" stroke="var(--btn)" stroke-width="2" points="${p.map((x,i)=>X(i)+','+Y(x[1])).join(' ')}"/>`+
    p.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x[1])}" r="3" fill="var(--btn)"/>`).join('')+
    `<g fill="var(--hint)" font-size="11"><text x="0" y="${Y(hi)+4}">${R(hi)}</text><text x="0" y="${Y(lo)+4}">${R(lo)}</text><text x="${P}" y="${H-4}">${fmt(p[0][0],1)}</text><text x="${W-10}" y="${H-4}" text-anchor="end">${fmt(p[p.length-1][0],1)}</text></g></svg>`;
}

/* ---------- вкладка «Дневник» ---------- */
function cal(){
  const y=view.getFullYear(),m=view.getMonth(),first=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate();
  let h=`<div class="row"><button class="g" onclick="mv(-1)">‹</button><b style="flex:1;text-align:center">${MN[m]} ${y}</b><button class="g" onclick="mv(1)">›</button></div><div class="cal">`+
    DN.map(x=>`<div class="h">${x}</div>`).join('')+'<div></div>'.repeat(first);
  for(let i=1;i<=n;i++){
    const k=iso(new Date(y,m,i));
    h+=`<div class="${k==date?'s ':''}${S.days[k]?'m ':''}${S.mk[k]&&S.mk[k].i?'i ':''}${k==today?'t':''}" onclick="pick('${k}')">${i}</div>`;
  }
  return `<div class="card">${h}</div></div>`;
}
const mv=d=>{view=new Date(view.getFullYear(),view.getMonth()+d,1);render()};
const pick=k=>{date=k;render()};

function day(){
  const d=S.days[date]||[],mk=S.mk[date]||{};
  return `<div class="card"><h3>${fmt(date)}</h3>`+
    d.map((e,i)=>`<div style="margin:12px 0"><div class="row"><b style="flex:1">${esc(e.n)}</b><button class="g" onclick="ask(()=>rmEx(${i}))">✕</button></div>`+
      e.s.map((s,j)=>`<div class="row"><span class="hint" style="width:18px">${j+1}</span><input type="number" inputmode="decimal" value="${s[0]}" onchange="setv(${i},${j},0,this.value)"><span>кг ×</span><input type="number" inputmode="numeric" value="${s[1]}" onchange="setv(${i},${j},1,this.value)"><button class="g" onclick="ask(()=>rmSet(${i},${j}))">−</button></div>`).join('')+
      `<button class="g" onclick="addSet(${i})">+ подход</button></div>`).join('')+
    (d.length?'':'<p class="hint">В этот день записей нет.</p>')+
    `<div class="row"><input id="ex" list="lib" placeholder="Упражнение"><button onclick="addEx()">Добавить</button></div>`+
    `<button class="g" style="width:100%" onclick="applyProg()">Внести тренировку по программе (${DN[wd(date)]})</button>`+
    (d.length?`<button class="d" style="width:100%;margin-top:8px" onclick="ask(()=>rmDay())">Удалить тренировку дня</button>`:'')+`</div>`+
    `<div class="card"><h3>Заметка</h3><button class="${mk.i?'d':'g'}" onclick="togImp()">${mk.i?'⭐ Важная тренировка':'☆ Отметить важной'}</button><textarea placeholder="Заметка к этому дню" onchange="setNote(this.value)">${esc(mk.t||'')}</textarea></div>`;
}
const prev=n=>{
  for(const x of Object.keys(S.days).filter(x=>x<date).sort().reverse()){
    const e=S.days[x].find(e=>e.n==n); if(e)return [...e.s[e.s.length-1]];
  } return [0,0];
};
function setv(i,j,k,v){S.days[date][i].s[j][k]=num(v);saveDay()}
function addSet(i){const s=S.days[date][i].s;s.push(s.length?[...s[s.length-1]]:[0,0]);saveDay();render()}
function rmSet(i,j){const e=S.days[date][i];e.s.splice(j,1);if(!e.s.length)S.days[date].splice(i,1);saveDay();render()}
function rmEx(i){S.days[date].splice(i,1);saveDay();render()}
function addLib(n){n=n.trim();if(n&&!S.lib.includes(n)){S.lib.push(n);put('lib',S.lib)}return n}
function addEx(){
  const n=addLib($('#ex').value); if(!n)return;
  (S.days[date]=S.days[date]||[]).push({n,s:[prev(n)]});saveDay();render();
}
function applyProg(){
  const p=S.prog[wd(date)]||[];
  if(!p.length){tg.showAlert('На этот день в программе пусто. Заполните её во вкладке «Профиль».');return}
  const d=S.days[date]=S.days[date]||[];
  p.forEach(x=>{const w=prev(x.n)[0]||x.w||0;d.push({n:x.n,s:Array.from({length:x.s},()=>[w,x.r])})});
  saveDay();render();
}

/* ---------- вкладка «Прогресс» ---------- */
function prog(){
  const names=[...new Set(Object.values(S.days).flat().map(e=>e.n))].sort();
  if(!names.length)return '<div class="card"><h3>Прогресс</h3><p class="hint">Пока нет данных. Запишите тренировку во вкладке «Дневник».</p></div>';
  const n=names[pe]||names[0];
  const pts=Object.keys(S.days).sort().map(k=>{
    const e=S.days[k].find(e=>e.n==n); if(!e)return null;
    return [k,pm==1?e.s.reduce((a,s)=>a+s[0]*s[1],0):pm==2?Math.max(...e.s.map(s=>s[0]*(1+s[1]/30))):Math.max(...e.s.map(s=>s[0]))];
  }).filter(Boolean);
  return `<div class="card"><h3>Прогресс</h3>
    <div class="row"><select style="flex:1" onchange="pe=this.selectedIndex;render()">${names.map(x=>`<option ${x==n?'selected':''}>${esc(x)}</option>`).join('')}</select>
    <select onchange="pm=+this.value;render()">${['Макс. вес','Объём','1ПМ (расч.)'].map((x,i)=>`<option value="${i}" ${pm==i?'selected':''}>${x}</option>`).join('')}</select></div>
    ${chart(pts)}
    <p class="hint">${['Максимальный вес за тренировку, кг.','Объём = сумма (вес × повторы) за тренировку.','Расчётный максимум на 1 повтор (формула Эпли).'][pm]} Тренировок: ${pts.length}. Лучший результат: ${R(Math.max(...pts.map(p=>p[1])))}</p></div>`+bars();
}

/* ---------- вкладка «Профиль» ---------- */
function prof(){
  const pts=Object.keys(S.bw).sort().map(k=>[k,S.bw[k]]), L=pts[pts.length-1];
  let h=`<div class="card"><h3>Вес тела</h3><div class="row"><input id="bw" type="number" inputmode="decimal" placeholder="кг, запись на ${fmt(today,1)}"><button onclick="addBw()">Записать</button></div>`+
    chart(pts.slice(-30))+(L?`<p class="hint">Последняя запись: ${R(L[1])} кг (${fmt(L[0],1)})</p>`:'')+`</div>`;
  h+=`<div class="card"><h3>Моя программа</h3><p class="hint">Выберите день недели и добавьте упражнения. В дневнике одна кнопка внесёт всю тренировку этого дня.</p><div class="row">`+
    DN.map((x,i)=>`<button class="${i==pd?'':'g'}" style="flex:1;padding:8px 0" onclick="pd=${i};render()">${x}</button>`).join('')+`</div>`;
  (S.prog[pd]||[]).forEach((x,i)=>h+=`<div class="row"><span style="flex:1">${esc(x.n)}: ${x.s}×${x.r}${x.w?', '+x.w+' кг':''}</span><button class="g" onclick="ask(()=>rmP(${i}))">✕</button></div>`);
  h+=`<div class="row"><input id="pn" list="lib" placeholder="Упражнение"></div><div class="row"><input id="ps" type="number" inputmode="numeric" placeholder="подходов"><input id="pr" type="number" inputmode="numeric" placeholder="повторов"><input id="pw" type="number" inputmode="decimal" placeholder="кг"><button onclick="addP()">+</button></div></div>`;
  h+=`<div class="card"><h3>Библиотека упражнений</h3>`+
    (S.lib.length?S.lib.map((x,i)=>`<div class="row"><span style="flex:1">${esc(x)}</span><button class="g" onclick="ask(()=>rmL(${i}))">✕</button></div>`).join(''):'<p class="hint">Пока пусто. Упражнения появляются здесь, когда вы их добавляете.</p>')+
    `<div class="row"><input id="ln" placeholder="Новое упражнение"><button onclick="addLib($('#ln').value);render()">+</button></div></div>`;
  h+=`<div class="card"><h3>Оформление</h3><div class="row"><span style="flex:1">Тема</span><select onchange="cfg('th',this.value)">${[['','Как в Telegram'],['l','Светлая'],['d','Тёмная']].map(x=>`<option value="${x[0]}" ${(S.cfg.th||'')==x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></div><div class="row"><span style="flex:1">Основной цвет</span><input type="color" style="flex:none;width:56px;height:36px;padding:2px" value="${S.cfg.a||'#2481cc'}" onchange="cfg('a',this.value)"></div><div class="row"><span style="flex:1">Цвет важных тренировок</span><input type="color" style="flex:none;width:56px;height:36px;padding:2px" value="${S.cfg.i||'#e5484d'}" onchange="cfg('i',this.value)"></div><button class="g" onclick="S.cfg={};put('cfg',S.cfg);theme();render()">Сбросить цвета</button></div>`;
  return h;
}
function addBw(){
  const v=num($('#bw').value); if(!v)return;
  S.bw[today]=v; const m=today.slice(0,7),o={};
  for(const k in S.bw)if(k.startsWith(m))o[k]=S.bw[k];
  put('bw:'+m,o);render();
}
function addP(){
  const n=addLib($('#pn').value); if(!n)return;
  (S.prog[pd]=S.prog[pd]||[]).push({n,s:Math.round(num($('#ps').value))||3,r:Math.round(num($('#pr').value))||10,w:num($('#pw').value)});
  put('prog',S.prog);render();
}
function rmP(i){S.prog[pd].splice(i,1);put('prog',S.prog);render()}
function rmL(i){S.lib.splice(i,1);put('lib',S.lib);render()}

/* ---------- пометки, заметки, оформление, таймер, график недель ---------- */
const ask=f=>tg.showConfirm('Удалить?',a=>a&&setTimeout(()=>tg.showConfirm('Точно удалить? Это нельзя отменить.',b=>b&&f()),250));
function rmDay(){S.days[date]=[];saveDay();render()}
const plus=n=>{const x=new Date(today+'T12:00');x.setDate(x.getDate()+n);return iso(x)};
function soon(){
  return [0,1,2].map(n=>[n,plus(n)]).filter(([n,k])=>S.mk[k]&&S.mk[k].i).map(([n,k])=>`<div class="card" style="border-left:4px solid var(--imp,#e5484d)"><b>⭐ ${n?'Через '+n+' '+(n==1?'день':'дня'):'Сегодня'}: важная тренировка</b><div class="hint">${fmt(k,1)}${S.mk[k].t?'. '+esc(S.mk[k].t):''}</div></div>`).join('');
}
function saveMk(){
  const m=date.slice(0,7),o={};
  for(const k in S.mk)if(k.startsWith(m))o[k]=S.mk[k];
  if(Object.keys(o).length)put('m:'+m,o);else call(cs.removeItem,'m:'+m);
}
function togImp(){const m=S.mk[date]=S.mk[date]||{};m.i=m.i?0:1;if(!m.i&&!m.t)delete S.mk[date];saveMk();render()}
function setNote(v){const m=S.mk[date]=S.mk[date]||{};m.t=v.trim();if(!m.i&&!m.t)delete S.mk[date];saveMk()}
function cfg(k,v){S.cfg[k]=v;put('cfg',S.cfg);theme();render()}
function theme(){
  const c=S.cfg,r=document.documentElement,set=(n,v)=>v?r.style.setProperty(n,v):r.style.removeProperty(n);
  r.dataset.th=c.th||'';set('--btn',c.a);set('--imp',c.i);
  if(c.a){const n=parseInt(c.a.slice(1),16);set('--btx',((n>>16)*299+((n>>8)&255)*587+(n&255)*114)/1000>150?'#000':'#fff')}else set('--btx','');
}
function bars(){
  const mon=d=>{const x=new Date(d+'T12:00');x.setDate(x.getDate()-wd(d));return iso(x)},w=[];
  let c=mon(today);
  for(let i=0;i<8;i++){w.unshift(c);const x=new Date(c+'T12:00');x.setDate(x.getDate()-7);c=iso(x)}
  const n=w.map(s=>Object.keys(S.days).filter(k=>mon(k)==s).length),mx=Math.max(...n,1);
  return `<div class="card"><h3>Тренировок в неделю</h3><svg viewBox="0 0 320 110" width="100%">`+n.map((v,i)=>`<rect x="${i*40+8}" y="${90-v/mx*60}" width="24" height="${v/mx*60}" rx="4" fill="var(--btn)"/><text x="${i*40+20}" y="${84-v/mx*60}" text-anchor="middle" font-size="11" fill="var(--tx)">${v}</text><text x="${i*40+20}" y="104" text-anchor="middle" font-size="10" fill="var(--hint)">${fmt(w[i],1)}</text>`).join('')+`</svg><p class="hint">Последние 8 недель.</p></div>`;
}
let tEnd=0,tInt;
function tmr(s){tEnd=s?Date.now()+s*1000:0;clearInterval(tInt);if(s)tInt=setInterval(tick,250);tick()}
function tick(){
  const left=Math.ceil((tEnd-Date.now())/1000);
  if(tEnd&&left<=0){tEnd=0;clearInterval(tInt);tg.HapticFeedback.notificationOccurred('success');navigator.vibrate&&navigator.vibrate([300,150,300]);tg.showAlert('Отдых закончен, пора на следующий подход!')}
  $('#tm').innerHTML=tEnd?`<b style="font-size:20px">⏱ ${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}</b><button class="g" onclick="tmr(0)">Стоп</button>`:'<span class="hint">⏱ Отдых:</span>'+[60,90,120,180].map(s=>`<button class="g" onclick="tmr(${s})">${s>=120?s/60+' мин':s+' с'}</button>`).join('');
}

/* ---------- запуск ---------- */
function render(){
  app.innerHTML=[()=>soon()+cal()+day(),prog,prof][tab]()+`<datalist id="lib">${S.lib.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`;
  document.querySelectorAll('nav button').forEach((b,i)=>b.classList.toggle('on',i==tab));
}
(async()=>{
  if(!u||!ALLOWED.includes(u.id)){app.innerHTML='<div class="card"><h3>Доступ закрыт</h3><p class="hint">Это личный дневник. Откройте его из своего бота в Telegram.</p></div>';return}
  try{await load()}catch(e){app.innerHTML='<div class="card"><h3>Не удалось загрузить данные</h3><p class="hint">Обновите Telegram и откройте приложение снова.</p></div>';return}
  theme();render();tick();
})();
</script>
</body></html>
