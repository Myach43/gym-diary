<style>

.row{display:flex;align-items:center;gap:9px}.sp{flex:1}

const isSnap=o=>o&&typeof o==='object'&&!Array.isArray(o)&&(o.days||o.lib)&&(o.v||o.cfg||o.bw||o.mk);
function merge(dst,src){if(!src)return;
  if(Array.isArray(src.lib))for(const e of src.lib){if(!e||!e.n)continue;const x=dst.lib.find(y=>norm(y.n)===norm(e.n));
    if(!x)dst.lib.push({n:e.n,g:e.g||'',t:e.t||'',s:typeof e.s==='string'?e.s:'',rest:e.rest||0});
    else{x.g=x.g||e.g||'';x.t=x.t||e.t||'';x.s=x.s||(typeof e.s==='string'?e.s:'');x.rest=x.rest||e.rest||0}}
  if(Array.isArray(src.prog)&&src.prog.length&&!dst.prog.length)dst.prog=src.prog.map(p=>({name:p.name||p.n||'День',ex:(p.ex||p.e||[]).filter(x=>typeof x==='string')}));
  for(const s of['days','bw','mk','wb','fin','arc']){const o=src[s];if(!o||typeof o!=='object')continue;
    for(const k in o){if(!(k in dst[s]))dst[s][k]=o[k];else if(s==='days'){const a=dst.days[k],b=o[k];
      if(Array.isArray(a)&&Array.isArray(b)&&b.reduce((x,e)=>x+(e.s?.length||0),0)>a.reduce((x,e)=>x+(e.s?.length||0),0))dst.days[k]=b}}}
  if(Array.isArray(src.rh)&&src.rh.length>dst.rh.length)dst.rh=src.rh.slice(-RHC);
  if(src.cfg&&typeof src.cfg==='object'&&!dst.cfg._lk){const c=src.cfg;dst.cfg.th=c.th||dst.cfg.th;dst.cfg.i=c.i||dst.cfg.i;dst.cfg.a=c.a||dst.cfg.a;dst.cfg.nx=c.nx||0;
    if(Array.isArray(c.tb)&&c.tb.length)dst.cfg.tb=[...new Set([...c.tb,420])].sort((a,b)=>a-b);dst.cfg._lk=1}}
function normalize(){const map={d:'gr',n:'ne',m:'pp'};S.cfg.th=map[S.cfg.th]||S.cfg.th;if(!TH.some(t=>t.id===S.cfg.th))S.cfg.th='gr';
  if(!Array.isArray(S.cfg.tb)||!S.cfg.tb.length)S.cfg.tb=[30,60,90,120,180,300,420];
  S.cfg.tb=[...new Set(S.cfg.tb.map(Number).filter(x=>x>=5&&x<=3600))].sort((a,b)=>a-b);
  S.cfg.rest=Number(S.cfg.rest)||90;S.cfg.ret=S.cfg.ret??'never';S.cfg.sp=S.cfg.sp||'m';S.cfg.ls=S.cfg.ls||'g';S.cfg.lf=S.cfg.lf||'';
  for(const k of['at','anim','vib'])S.cfg[k]=S.cfg[k]===0?0:1;delete S.cfg._lk;
  const cn={};for(const e of S.lib){e.rest=Number(e.rest)||0;cn[norm(e.n)]=e.n}
  for(const d in S.days){const seen={},out=[];for(const e of(S.days[d]||[])){if(!e||!e.n)continue;e.n=cn[norm(e.n)]||e.n;
      e.s=(e.s||[]).filter(Array.isArray).map(x=>[num(x[0]),Math.round(num(x[1]))]);const k=norm(e.n);
      if(seen[k]){seen[k].s.push(...e.s);if(e.ss&&!seen[k].ss)seen[k].ss=e.ss}else{const o={n:e.n,s:e.s};if(e.ss)o.ss=e.ss;seen[k]=o;out.push(o)}}S.days[d]=out}
  for(const r of S.rh)r.n=cn[norm(r.n)]||r.n;
  if(!S.prog.length){S.prog=T4.map(n=>({name:n,ex:[]}));S.cfg.nx=0}
  S.prog=S.prog.slice(0,7);S.cfg.nx=cl(S.cfg.nx||0,0,S.prog.length-1);S.rh=(S.rh||[]).slice(-RHC)}

async function readParts(m){for(const g of[m.gen,1-m.gen]){try{const p=g===m.gen?m.parts:(m.prevParts||null);if(!p)continue;
  const keys=[];for(const s in p)for(let i=0;i<p[s];i++)keys.push(`${NS}_${g}_${s}_${i}`);if(!keys.length)continue;
  const map=await cMany(keys),o=blank();for(const s in p){let str='';for(let i=0;i<p[s];i++)str+=map[`${NS}_${g}_${s}_${i}`]||'';if(str)o[s]=JSON.parse(str)}
  if(Object.keys(o.days).length||o.lib.length)return o}catch(e){}}return null}
async function readCloud(){const r=await cGet(NS+'_meta');if(!r)return{state:null,meta:null};
  let m;try{m=JSON.parse(r)}catch(e){return{fail:true}}
  if(m.ns){for(const g of[m.gen,1-m.gen]){const n=(m.ns||[])[g]||0;if(!n)continue;
      try{const map=await cMany(rng(n).map(i=>K(g,i)));let s='',ok=true;for(let i=0;i<n;i++){const v=map[K(g,i)];if(v==null){ok=false;break}s+=v}
        if(!ok)continue;const o=JSON.parse(s);if(o&&o.days)return{state:o,meta:m}}catch(e){}}
    if(m.old){const st=await readParts(m.old);if(st)return{state:st,meta:m}}return{fail:true,meta:m}}
  if(m.parts){const st=await readParts(m);return st?{state:st,meta:m}:{fail:true,meta:m}}
  return{state:null,meta:null}}
async function legacyScan(){const keys=await cc('getKeys',[],14000,2),old=keys.filter(k=>!k.startsWith(NS+'_'));U.legacy=old.length;
  const f=blank();if(!old.length)return f;const vals={};
  for(let i=0;i<old.length;i+=50){try{Object.assign(vals,await cMany(old.slice(i,i+50)))}catch(e){}}
  const ch={},sg=[];for(const k of old){const v=vals[k];if(typeof v!=='string'||!v)continue;
    const m=k.match(/^(.*?)[_.\-](\d{1,3})$/);if(m){(ch[m[1]]=ch[m[1]]||[]).push([+m[2],v])}else sg.push(v)}
  const P=s=>{try{return JSON.parse(s)}catch(e){return null}};
  const eat=o=>{if(isSnap(o))merge(f,o);else if(o&&typeof o==='object'){if(Array.isArray(o.lib))merge(f,{lib:o.lib});if(o.days)merge(f,{days:o.days});if(o.bw)merge(f,{bw:o.bw});if(o.mk)merge(f,{mk:o.mk});if(o.prog)merge(f,{prog:o.prog});if(o.cfg)merge(f,{cfg:o.cfg})}};
  for(const k in ch){const o=P(ch[k].sort((a,b)=>a[0]-b[0]).map(x=>x[1]).join(''));if(o)eat(o)}
  for(const v of sg){const o=P(v);if(!o)continue;if(isSnap(o)){eat(o);continue}
    if(Array.isArray(o)&&o.length&&o[0]&&typeof o[0]==='object'){if(typeof o[0].s==='string'||'g'in o[0])merge(f,{lib:o});else if(o[0].name||o[0].ex)merge(f,{prog:o});continue}
    if(o&&typeof o==='object'){const ks=Object.keys(o);
      if(ks.length&&ks.every(x=>/^\d{4}-\d{2}-\d{2}$/.test(x))){const v0=o[ks[0]];
        if(typeof v0==='number')merge(f,{bw:o});else if(Array.isArray(v0))merge(f,{days:o});

        else if(v0&&typeof v0==='object'&&('sl'in v0||'dc'in v0))merge(f,{wb:o});continue}
      if('th'in o||'tb'in o)merge(f,{cfg:o})}}
  return f}

function setCS(s){U.cs=s;const d=$('#cd'),t=$('#ct');if(d)d.className='dot'+(s==='saving'?' saving':s==='err'?' err':s==='off'?' off':'');

function plan(ms){dirty=true;mirror();if(!CS){setCS('off');return}if(safe){setCS('err');return}setCS('saving');clearTimeout(sT);sT=setTimeout(()=>save(),ms??1100)}
async function save(force){
  if(!CS){setCS('off');dirty=false;return}
  if(safe&&!force){setCS('err');return}
  if(!dirty&&!force)return;
  if(busy){queue=true;return}
  const j=JSON.stringify(pack());
  if(!force&&j===lastJ&&U.cs==='ok'){dirty=false;return}
  busy=true;queue=false;dirty=false;setCS('saving');mirror();
  try{
    let m=null;const r=await cGet(NS+'_meta');if(r){try{m=JSON.parse(r)}catch(e){m=null}}
    const blob=!!(m&&m.ns),g=m?1-(m.gen||0):0,parts=chunkify(j),n=parts.length;
    let old={};const pn=blob?(m.ns[g]||0):0;
    if(pn){try{old=await cMany(rng(pn).map(i=>K(g,i)))}catch(e){old={}}}
    for(let i=0;i<n;i++){const k=K(g,i);if(old[k]===parts[i])continue;await cSet(k,parts[i]);await wait(70)}
    const ns=blob?m.ns.slice():[0,0],before=ns[g]||0;ns[g]=n;
    const nm={v:7,gen:g,ns,ts:Date.now()};
    if(m&&m.parts)nm.old={gen:m.gen,parts:m.parts,prevParts:m.prevParts||null};else if(m&&m.old)nm.old=m.old;
    await cSet(NS+'_meta',JSON.stringify(nm));
    for(let i=n;i<before;i++){try{await cDel(K(g,i));await wait(50)}catch(e){}}
    U.last=Date.now();lastJ=j;lastE='';const back=errs>0||safe;errs=0;if(force)safe=false;setCS('ok');clearTimeout(rT);
    if(back){toast('ok','cloud','Связь с облаком восстановлена — всё сохранено ✓');render(true)}
  }catch(e){dirty=true;lastE=String(e.message||e);errs++;setCS('err');
    if(errs===1)toast('err','warn','Облако не ответило ('+eh(lastE)+'). Копия на телефоне есть, повторю сам.',6000);
    clearTimeout(rT);rT=setTimeout(()=>{if(dirty&&CS&&!safe)save()},errs<3?15000:45000)}
  busy=false;if(queue||dirty){clearTimeout(sT);sT=setTimeout(()=>save(),1200)}}

sc:e=>{const d=U.wd=U.wd||{...(S.wb[today()]||{})},c=$('#wc');if(c)d.c=c.value;const k=e.dataset.k,v=+e.dataset.v;d[k]=d[k]===v?0:v;U.we=true;wbAuto();vib('sel');rr()},
wedit:()=>{U.we=true;U.wd={...(S.wb[today()]||{})};rr()},
pdel:e=>{const d=U.wd=U.wd||{...(S.wb[today()]||{})},c=$('#wc');if(c)d.c=c.value;d.dc=(d.dc||[]).filter((_,i)=>i!==+e.dataset.i);U.we=true;wbAuto();rr()},
padd:()=>{const c=$('#wc');if(c)(U.wd=U.wd||{...(S.wb[today()]||{})}).c=c.value;
  const cur=(U.wd||S.wb[today()]||{}).dc||[];
  sheet(`<h2>${I('heart')}Где дискомфорт?</h2><div class="desc">Выбери зону и силу от 1 до 10. Можно несколько сразу.</div><div class="chips" id="pp">${PARTS.map(p=>`<button class="chip ${cur.some(x=>x.p===p)?'on':''}" data-act="pp" data-p="${esc(p)}">${esc(p)}</button>`).join('')}</div><label>Сила: <b id="pv" class="mono">3</b>/10</label><input type="range" id="pr" min="1" max="10" value="3"><div class="acts"><button class="btn sec" data-act="close">Отмена</button><button class="btn" id="pok">Добавить</button></div>`);
  $('#pr').oninput=e=>{$('#pv').textContent=e.target.value};
  $('#pok').onclick=()=>{const sel=$$('#pp .chip.on').map(x=>x.dataset.p),v=+$('#pr').value;
    if(!sel.length){toast('warn','warn','Выбери хотя бы одну зону');return}
    const d=U.wd=U.wd||{...(S.wb[today()]||{})};d.dc=d.dc||[];
    for(const p of sel){const x=d.dc.find(y=>y.p===p);if(x)x.v=v;else d.dc.push({p,v})}
    U.we=true;wbAuto();closeSheet();rr()}},
pp:e=>{e.classList.toggle('on');vib('sel')},
wsave:()=>{wbAuto();U.we=false;U.wd=null;vib('ok');rr();toast('ok','heart','Состояние записано')},
next:()=>start(S.cfg.nx),
start:e=>start(+e.dataset.i),
repeat:()=>{const ds=Object.keys(S.days).filter(d=>d<today()&&S.days[d].length).sort();
  if(!ds.length){toast('warn','warn','Нет прошлых тренировок');return}
  const d=ds[ds.length-1],src=S.days[d];
  ask('Повторить тренировку?',`Копия от <b>${ff(d)}</b>: ${src.length} ${pl(src.length,'упражнение','упражнения','упражнений')}. Подходы начнутся пустыми — с подсказками прошлого раза.`,'Повторить',()=>{
    const t=today();S.days[t]=S.days[t]||[];let n=0;
    for(const e of src)if(!S.days[t].some(x=>norm(x.n)===norm(e.n))){const o={n:e.n,s:[]};if(e.ss)o.ss=e.ss;S.days[t].push(o);n++}
    delete S.fin[t];plan();U.date=t;U.auto=1;tab('diary');toast('ok','undo','Добавлено '+n+' упр.')})},
empty:()=>{const t=today();if(!S.days[t])S.days[t]=[];delete S.fin[t];plan();U.date=t;U.auto=1;tab('diary')},
pe:()=>{U.pe=!U.pe;rr()},
padd2:()=>{if(S.prog.length>=7){toast('warn','warn','Максимум 7 дней');return}
  ask('Добавить день программы?','Появится новый пустой день. Его можно переименовать и наполнить упражнениями.','Добавить',()=>{S.prog.push({name:'День '+(S.prog.length+1),ex:[]});plan();rr();toast('ok','plus','День добавлен')})},
prm:e=>{const i=+e.dataset.i,p=S.prog[i];
  if(S.prog.length<=1){toast('warn','warn','Оставь хотя бы один день');return}
  ask('Удалить день?',`«<b>${esc(p.name)}</b>» исчезнет из программы. История тренировок останется.`,'Удалить',()=>{S.prog.splice(i,1);S.cfg.nx=cl(S.cfg.nx,0,S.prog.length-1);plan();rr()},true)},
pu:e=>{const i=+e.dataset.i,a=S.prog;if(i>0){const t=a[i-1];a[i-1]=a[i];a[i]=t;plan();rr()}},
pdn:e=>{const i=+e.dataset.i,a=S.prog;if(i<a.length-1){const t=a[i+1];a[i+1]=a[i];a[i]=t;plan();rr()}},
pedit:e=>progSheet(+e.dataset.i),
tpl:e=>{const n=+e.dataset.n;
  ask('Применить шаблон?',`Дни программы заменятся шаблоном на <b>${n} ${pl(n,'день','дня','дней')}</b>. История и веса не тронутся.`,'Применить',()=>{S.prog=(n===3?T3:T4).map(x=>({name:x,ex:[]}));S.cfg.nx=0;plan();rr();toast('ok','cal','Шаблон применён')})},
prevd:()=>{U.date=shift(U.date,-1);U.auto=0;rr()},
nextd:()=>{if(U.date<today()){U.date=shift(U.date,1);U.auto=U.date===today()?1:0;rr()}},
td:()=>{U.date=today();U.auto=1;rr()},
mk:()=>{const d=U.date,m=S.mk[d]||{};
  sheet(`<h2>${I('note')}Заметка · ${fd(d)}</h2><div class="desc">Сохраняется само, пока ты печатаешь.</div><label>Комментарий к дню</label><textarea id="mt" placeholder="Как прошла тренировка, события…">${esc(m.t||'')}</textarea><div class="so" style="margin-top:9px"><div class="ol2"><b>Важная ⭐</b><span>пометить день звездой</span></div><button class="sw ${m.i?'on':''}" id="mi"></button></div><div class="acts"><button class="btn" id="mok">Готово</button></div>`);
  const commit=()=>{const t=$('#mt').value.trim(),i=$('#mi').classList.contains('on')?1:0;
    if(!t&&!i)delete S.mk[d];else S.mk[d]={i,t};plan(500)};
  $('#mt').oninput=commit;
  $('#mi').onclick=e=>{e.currentTarget.classList.toggle('on');commit();vib('sel')};
  $('#mok').onclick=()=>{commit();closeSheet();rr();toast('ok','note','Заметка сохранена')}},
check:e=>check(+e.dataset.i,+e.dataset.j),
sedit:e=>{const i=+e.dataset.i,j=+e.dataset.j,s=S.days[U.date][i].s[j],r=$('#sr-'+i+'-'+j);if(!r)return;
  r.outerHTML=`<div class="sr" id="sr-${i}-${j}"><span class="n">${j+1}</span><input class="w mono" id="w-${i}-${j}" inputmode="decimal" value="${kg(s[0])}"><span class="t">×</span><input class="r mono" id="r-${i}-${j}" inputmode="numeric" value="${s[1]}"><button class="ck" data-act="ssave" data-i="${i}" data-j="${j}">${I('check')}</button></div>`;
  const inp=$('#w-'+i+'-'+j);if(inp){inp.focus();inp.select()}},
ssave:e=>{const i=+e.dataset.i,j=+e.dataset.j,d=U.date,x=S.days[d][i];
  const w=num($('#w-'+i+'-'+j).value),r=Math.round(num($('#r-'+i+'-'+j).value));
  if(w<0){toast('warn','warn','Вес не может быть отрицательным');return}
  if(r<1){toast('warn','warn','Повторы должны быть хотя бы 1');return}
  const b=best(x.n,{d,i,j});x.s[j]=[w,r];
  if(b.w>0&&w>b.w)record(x.n,w,r,d);else vib('light');
  U.anch='ex-'+i;plan();rr()},
sdel:e=>{const i=+e.dataset.i,j=+e.dataset.j,x=S.days[U.date][i],rm=x.s[j];
  x.s.splice(j,1);U.anch='ex-'+i;plan();rr();
  toast('warn','trash','Подход удалён',4600,()=>{x.s.splice(j,0,rm);plan();rr()})},
addset:e=>{const i=+e.dataset.i,x=S.days[U.date][i],l=x.s[x.s.length-1];
  x.s.push(l?[l[0],l[1]]:[0,8]);U.anch='ex-'+i;plan();rr();
  setTimeout(()=>{const n=$('#w-'+i+'-'+(x.s.length-1));if(n){n.focus();n.select()}},60)},
dw:e=>delta(+e.dataset.i,'w',+e.dataset.v),
dr:e=>delta(+e.dataset.i,'r',+e.dataset.v),
exm:e=>exSheet(+e.dataset.i),
exrm:e=>{const i=+e.dataset.i,d=U.date,rm=S.days[d][i];closeSheet();
  S.days[d].splice(i,1);plan();rr();
  toast('warn','trash','«'+rm.n+'» убрано',5200,()=>{S.days[d].splice(Math.min(i,S.days[d].length),0,rm);plan();rr()})},
exup:e=>{const i=+e.dataset.i,a=S.days[U.date];if(i>0){const t=a[i-1];a[i-1]=a[i];a[i]=t;U.anch='ex-'+(i-1);closeSheet();plan();rr()}},
exdn:e=>{const i=+e.dataset.i,a=S.days[U.date];if(i<a.length-1){const t=a[i+1];a[i+1]=a[i];a[i]=t;U.anch='ex-'+(i+1);closeSheet();plan();rr()}},
rep:e=>{const i=+e.dataset.i,x=S.days[U.date][i],g=(lib(x.n)||{}).g;
  const al=S.lib.filter(y=>y.g===g&&norm(y.n)!==norm(x.n));
  sheet(`<h2>${I('swap')}Заменить упражнение</h2><div class="desc">«${esc(x.n)}» → альтернативы из группы <b>${esc(g||'Без группы')}</b>. Записанные подходы перенесутся как есть.</div><div class="ol">${al.map(a=>`<button data-act="reps" data-i="${i}" data-n="${esc(a.n)}">${esc(a.n)}<span class="tiny">${esc(a.t||'')}</span></button>`).join('')||'<div class="tiny">В этой группе нет других упражнений — добавь их в «Базе».</div>'}</div><label>Или найди любое</label>${acw('rep','Название или группа мышц…')}<input type="hidden" id="ri" value="${i}">`)},
reps:e=>{const i=+e.dataset.i,x=S.days[U.date][i],old=x.n;x.n=e.dataset.n;
  closeSheet();U.anch='ex-'+i;plan();rr();
  toast('ok','swap','«'+old+'» → «'+x.n+'»',4600,()=>{x.n=old;plan();rr()})},
rest:e=>{const i=+e.dataset.i,x=S.days[U.date][i],L=lib(x.n);if(!L)return;
  sheet(`<h2>${I('timer')}Отдых · ${esc(x.n)}</h2><div class="desc">Своё время отдыха для этого упражнения. 0 — как по умолчанию (${S.cfg.rest} с).</div><div class="chips">${[0,45,60,90,120,150,180,240,300,420].map(v=>`<button class="chip ${(L.rest||0)===v?'on':''}" data-act="rests" data-i="${i}" data-v="${v}">${v===0?'По умолчанию':v>=60?(v/60)+' мин'+(v%60?' '+(v%60)+'с':''):v+' с'}</button>`).join('')}</div>`)},
rests:e=>{const L=lib(S.days[U.date][+e.dataset.i].n);if(L)L.rest=+e.dataset.v;closeSheet();plan();rr();toast('ok','timer','Отдых обновлён')},
ssm:()=>{if((S.days[U.date]||[]).length<2){toast('warn','warn','Нужно минимум 2 упражнения');return}U.ssm=true;U.sss=[];rr()},
sssel:e=>{const i=+e.dataset.i,k=U.sss.indexOf(i);if(k>=0)U.sss.splice(k,1);else U.sss.push(i);vib('sel');rr()},
ssx:()=>{U.ssm=false;U.sss=[];rr()},
ssmake:()=>{if(U.sss.length<2)return;
  const g='s'+uid(),a=S.days[U.date],sel=[...U.sss].sort((x,y)=>x-y),chosen=sel.map(i=>a[i]),f=sel[0],rest=a.filter((_,i)=>!U.sss.includes(i));
  S.days[U.date]=[...rest.slice(0,f),...chosen.map(e=>({...e,ss:g})),...rest.slice(f)];
  U.ssm=false;U.sss=[];plan();rr();vib('ok');toast('ok','link','Суперсет из '+chosen.length+' собран')},
ssclr:e=>{for(const x of S.days[U.date])if(x.ss===e.dataset.g)delete x.ss;plan();rr();toast('ok','link','Суперсет разъединён')},
fin:()=>{const d=U.date,rc=S.rh.filter(r=>r.d===d);
  sheet(`<h2>${I('cup')}Завершить тренировку?</h2><div class="desc">${ff(d)}</div><div class="kpi"><div><div class="v mono">${(S.days[d]||[]).length}</div><div class="k">упражнений</div></div><div><div class="v mono">${nsets(d)}</div><div class="k">подходов</div></div><div><div class="v mono">${ton(tonn(d))}</div><div class="k">тоннаж</div></div><div><div class="v mono" style="color:var(--gold)">${rc.length} 🏆</div><div class="k">рекордов</div></div></div>${rc.length?'<div style="margin-top:9px">'+rc.map(r=>`<div class="lr">🏆<span class="sp">${esc(r.n)}</span><span class="mono">${kg(r.w)} кг</span></div>`).join('')+'</div>':''}${S.wb[d]?'':`<div class="wb" style="margin-top:9px">${I('heart')}Состояние сегодня не записано — это можно сделать на вкладке «Сегодня».</div>`}<div class="acts"><button class="btn sec" data-act="close">Ещё тренируюсь</button><button class="btn" data-act="finok">Завершить ✓</button></div>`)},
finok:()=>{S.fin[U.date]=1;closeSheet();plan();confetti();vib('ok');rr();toast('ok','cup','Тренировка завершена. Красавчик!')},
reopen:()=>{delete S.fin[U.date];plan();rr()},
pick:e=>pick(e.dataset.c,e.dataset.n),
new:e=>{const n=e.dataset.n.trim();if(!n)return;const c=e.dataset.c,x=S.lib.find(y=>norm(y.n)===norm(n));
  if(x){pick(c,x.n);return}
  const f=S.lib.map(y=>[lev(norm(n),norm(y.n)),y]).filter(z=>z[0]<=2&&n.length>=4).sort((a,b)=>a[0]-b[0])[0];
  if(f){ask('Похожее упражнение',`Ты ввёл «<b>${esc(n)}</b>». Очень похоже на «<b>${esc(f[1].n)}</b>». Это одно и то же?`,`Да, взять «${f[1].n}»`,()=>pick(c,f[1].n));
    setTimeout(()=>{const a=$('.sheet .acts');if(a){const b=document.createElement('button');b.className='btn ghost';b.textContent='Нет, создать новое';b.onclick=()=>{closeSheet();create(c,n)};a.prepend(b)}},0);return}
  create(c,n)},
grp:e=>{const g=e.dataset.g;U.lo[g]=U.lo[g]===false;rr()},
lf:e=>{S.cfg.lf=e.dataset.g;plan();rr()},
ladd:()=>libSheet(null),
ledit:e=>libSheet(e.dataset.n),
per:e=>{S.cfg.sp=e.dataset.p;plan();rr()},
bwadd:()=>bwSheet(),
bwdel:e=>{const d=e.dataset.d,v=S.bw[d];
  ask('Удалить запись веса?',`${ff(d)} · <b>${kg(v)} кг</b>`,'Удалить',()=>{delete S.bw[d];plan();rr();toast('warn','trash','Запись удалена',4600,()=>{S.bw[d]=v;plan();rr()})},true)},
bq:()=>{const v=num($('#bq').value);
  if(v<20||v>300){toast('warn','warn','Похоже на опечатку. Вес в кг, например 57,5');return}
  S.bw[today()]=v;plan();vib('ok');rr();toast('ok','scale','Вес записан')},
th:e=>{S.cfg.th=e.dataset.id;theme(true);vib('sel');rr()},
tanim:()=>{S.cfg.anim=S.cfg.anim?0:1;theme(true);rr()},
tvib:()=>{S.cfg.vib=S.cfg.vib?0:1;plan();rr();vib('ok')},
tat:()=>{S.cfg.at=S.cfg.at?0:1;plan();rr()},
tbdel:e=>{if(S.cfg.tb.length<=1){toast('warn','warn','Оставь хотя бы одну кнопку');return}
  S.cfg.tb=S.cfg.tb.filter(x=>x!==+e.dataset.v);plan();rr();tbar()},
tbadd:()=>{const v=Math.round(num($('#tbnew').value));
  if(v<5||v>3600){toast('warn','warn','От 5 до 3600 секунд');return}
  if(!S.cfg.tb.includes(v))S.cfg.tb.push(v);
  S.cfg.tb.sort((a,b)=>a-b);plan();rr();tbar();toast('ok','timer','Добавлено в быстрое меню')},
tbq:e=>{const v=+e.dataset.v;if(!S.cfg.tb.includes(v))S.cfg.tb.push(v);S.cfg.tb.sort((a,b)=>a-b);plan();rr();tbar()},
pnow:()=>{if(S.cfg.ret==='never'){toast('warn','warn','Сначала выбери срок хранения');return}
  ask('Очистить старые заметки?',`Заметки о самочувствии старше «<b>${RET.find(r=>String(r[0])===String(S.cfg.ret))[1]}</b>» уйдут в архив. Тренировки, веса и рекорды останутся.`,'Очистить',()=>{const n=purge();plan();rr();toast(n?'ok':'warn','trash',n?n+' записей в архиве':'Нечего очищать')},true)},
arc:()=>{const ks=Object.keys(S.arc).sort().reverse();
  sheet(`<h2>${I('book')}Архив самочувствия</h2><div class="desc">Компактные записи после автоочистки. Хранятся последние ${ARCC}. Входят в экспорт.</div>${ks.length?ks.map(d=>{const a=S.arc[d];let s='';
    if(a.w){const L={sl:'сон',en:'энергия',st:'самочувствие'};s+=Object.keys(L).filter(k=>a.w[k]).map(k=>L[k]+' '+a.w[k]+'/5').join(', ');
      if(a.w.dc)s+=(s?' · ':'')+a.w.dc.map(x=>x.p+' '+x.v+'/10').join(', ');
      if(a.w.c)s+=(s?' · ':'')+'«'+a.w.c+'»'}
    if(a.m&&a.m.t)s+=(s?' · ':'')+'заметка: «'+a.m.t+'»';
    return`<div class="lr"><span class="tiny" style="flex:none">${fd(d)}</span><span class="sp sub" style="font-size:12px">${esc(s||'—')}</span></div>`}).join(''):'<div class="tiny">Архив пока пуст.</div>'}`)},
exp:()=>{const j=JSON.stringify(pack());
  sheet(`<h2>${I('down')}Экспорт резервной копии</h2><div class="desc">${Object.keys(S.days).length} тренировок · ${S.lib.length} упражнений · ${(j.length/1024).toFixed(1)} КБ. JSON совместим со старыми версиями, CSV открывается в Excel.</div><div class="acts" style="margin-top:0"><button class="btn" id="ed">${I('down')}JSON</button><button class="btn sec" id="ev">CSV</button><button class="btn sec" id="ec">${I('copy')}Копировать</button></div><label>Или скопируй вручную</label><textarea class="code" id="et" readonly>${esc(j)}</textarea>`);
  const dl=(txt,name,type)=>{try{const b=new Blob([txt],{type}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},800);toast('ok','down','Файл скачивается')}catch(e){toast('warn','warn','Скачивание заблокировано — скопируй текст')}};
  $('#ed').onclick=()=>dl(j,'gym-backup-'+today()+'.json','application/json');
  $('#ev').onclick=()=>{let c='date;exercise;group;set;weight_kg;reps\n';
    for(const d of Object.keys(S.days).sort())S.days[d].forEach(e=>{const g=(lib(e.n)||{}).g||'';
      e.s.forEach((s,i)=>{c+=[d,'"'+e.n.replace(/"/g,'""')+'"','"'+g+'"',i+1,s[0],s[1]].join(';')+'\n'})});
    dl('\ufeff'+c,'gym-'+today()+'.csv','text/csv;charset=utf-8')};
  $('#ec').onclick=async()=>{try{await navigator.clipboard.writeText(j);toast('ok','copy','Скопировано в буфер')}catch(e){$('#et').select();toast('warn','copy','Выделено — скопируй вручную')}};
  $('#et').onclick=e=>e.target.select()},
imp:()=>{sheet(`<h2>${I('up')}Импорт копии</h2><div class="desc">Вставь JSON из экспорта (v3–v7) или выбери файл. Данные объединятся: существующие даты не затрутся пустыми, при конфликте победит вариант с большим числом подходов.</div><input type="file" id="if" accept=".json,.txt,application/json" style="padding:9px"><label>…или вставь текст</label><textarea class="code" id="it" placeholder='{"v":4,"lib":[…],"days":{…}}'></textarea><div class="acts"><button class="btn sec" data-act="close">Отмена</button><button class="btn" id="io">Импортировать</button></div>`);
  $('#if').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#it').value=String(r.result||'')};r.onerror=()=>toast('err','warn','Файл не читается');r.readAsText(f)};
  $('#io').onclick=()=>{let d;
    try{d=JSON.parse($('#it').value)}catch(e){toast('err','warn','Не читается как JSON — проверь, что скопировал целиком');return}
    if(!d||typeof d!=='object'||(!d.days&&!d.lib)){toast('err','warn','Не похоже на копию дневника');return}
    closeSheet();
    ask('Импортировать?',`В копии: <b>${Object.keys(d.days||{}).length}</b> тренировок, <b>${(d.lib||[]).length}</b> упражнений. Текущие записи сохранятся, недостающие добавятся.`,'Импортировать',()=>{mirror();applyImp(d);toast('ok','up','Импорт завершён')})}},

function delta(i,k,v){const x=S.days[U.date][i];if(!x)return;
  const j=x.s.length,wI=$('#w-'+i+'-'+j),rI=$('#r-'+i+'-'+j);if(!wI||!rI)return;
  let w=num(wI.value),r=Math.round(num(rI.value));
  if(!w&&!r&&x.s.length){w=x.s[x.s.length-1][0];r=x.s[x.s.length-1][1]}
  if(!w&&!r){const p=prev(x.n,U.date);if(p&&p.ex.s[0]){w=p.ex.s[0][0];r=p.ex.s[0][1]}}
  if(k==='w')w=Math.max(0,Math.round((w+v)*100)/100);else r=Math.max(1,r+v);
  wI.value=kg(w);rI.value=r;vib('sel');
  clearTimeout(dT);dT=setTimeout(()=>commitSet(i,j),1200)}

function check(i,j){const d=U.date,x=S.days[d][i];if(!x)return;
  const wI=$('#w-'+i+'-'+j),rI=$('#r-'+i+'-'+j);if(!wI||!rI)return;
  let w=num(wI.value),r=Math.round(num(rI.value));
  if(!w&&!r){
    if(x.s.length){w=x.s[x.s.length-1][0];r=x.s[x.s.length-1][1]}
    else{const p=prev(x.n,d);if(p&&p.ex.s[0]){w=p.ex.s[0][0];r=p.ex.s[0][1]}}
    if(!r){wI.focus();toast('warn','warn','Введи вес и повторы — дальше ✓ скопирует их');return}}
  if(w<0){toast('warn','warn','Вес не может быть отрицательным');wI.focus();return}
  if(r<1){toast('warn','warn','Повторы должны быть хотя бы 1');rI.focus();return}
  const b=best(x.n);
  x.s[j]=[w,r];
  if(b.w>0&&w>b.w)record(x.n,w,r,d);else vib('light');
  let go=S.cfg.at;
  if(x.ss){const a=S.days[d],k=a.indexOf(x);let last=k;
    for(let n=k+1;n<a.length;n++)if(a[n].ss===x.ss)last=n;
    go=go&&k===last}
  if(go){const L=lib(x.n);timerStart((L&&L.rest)||S.cfg.rest,x.n)}
  U.anch='ex-'+i;plan();rr();
  const el=$('#sr-'+i+'-'+j);if(el)el.classList.add('fl','pp')}

function record(n,w,r,d){S.rh.push({n,w,r,d});
  if(S.rh.length>RHC)S.rh=S.rh.slice(-RHC);
  confetti();vib('ok');toast('rec','cup','Новый рекорд: '+n+' — '+kg(w)+' кг!',4400)}

    if(a.some(e=>norm(e.n)===norm(n))){toast('warn','warn','Уже в тренировке');U.anch='ex-'+a.findIndex(e=>norm(e.n)===norm(n));rr();return}
    if(!lib(n))S.lib.push({n,g:'',t:'',s:'',rest:0});
    a.push({n:lib(n).n,s:[]});delete S.fin[d];U.anch='ex-'+(a.length-1);plan();rr();vib('light')}
  else if(c==='prog'){const p=S.prog[+$('#pi').value];if(!p)return;

  if(e)$('#ld').onclick=()=>{closeSheet();

let T={end:0,tot:0,n:'',iv:null};
function timerStart(sec,name){if(!sec||sec<1)return;
  T.end=Date.now()+sec*1000;T.tot=sec;T.n=name||'';
  ls(NS+'_timer',JSON.stringify({end:T.end,tot:T.tot,n:T.n}));
  if(!T.iv)T.iv=setInterval(timerTick,250);
  tbar();vib('light')}
function timerPlus(s){if(!T.end)return;T.end+=s*1000;T.tot+=s;
  ls(NS+'_timer',JSON.stringify({end:T.end,tot:T.tot,n:T.n}));tbar();vib('sel')}
function timerStop(skip){T.end=0;T.tot=0;T.n='';
  if(T.iv){clearInterval(T.iv);T.iv=null}
  try{localStorage.removeItem(NS+'_timer')}catch(e){}
  document.body.classList.remove('ton');
  const b=$('#tbar');if(b){b.className='';b.innerHTML=''}
  if(skip)vib('sel')}
function timerTick(){if(!T.end)return;
  const l=T.end-Date.now();
  if(l<=0){tbar(true);vib('end');toast('ok','timer','Отдых закончен — следующий подход!',3500);
    try{localStorage.removeItem(NS+'_timer')}catch(e){}
    setTimeout(()=>{if(T.end&&Date.now()-T.end>4500)timerStop()},5000);return}
  tbar()}
function tbar(end){const b=$('#tbar');if(!b)return;
  if(!T.end){b.className='';b.innerHTML='';document.body.classList.remove('ton');return}
  document.body.classList.add('ton');
  const l=Math.max(0,T.end-Date.now()),s=Math.ceil(l/1000),p=T.tot?cl(l/(T.tot*1000),0,1):0;
  const m=Math.floor(s/60),ss=s%60,c=end?cv('--ok'):cv('--ac');
  b.className='on'+(end?' end':(s<=5&&!end?' low':''));
  b.innerHTML=`<div class="ring" style="width:48px;height:48px">${ring(Math.round(p*100),48,c)}</div><div><div class="tt mono">${end?'GO!':m+':'+String(ss).padStart(2,'0')}</div><div class="tl">${end?'Отдых закончен':esc(T.n||'Отдых')}</div></div><div class="sp"></div>${S.cfg.tb.slice(0,3).map(v=>`<button class="q" data-act="tset" data-v="${v}">${v>=60?(v/60)+'м':v+'с'}</button>`).join('')}<button class="q" data-act="tp">+15с</button><button class="ib" data-act="ts">${I('x')}</button>`}
function timerRestore(){try{const t=JSON.parse(lg(NS+'_timer')||'null');
  if(t&&t.end&&t.end>Date.now()){T.end=t.end;T.tot=t.tot||60;T.n=t.n||'';
    if(!T.iv)T.iv=setInterval(timerTick,250);tbar()}}catch(e){}}

  if(e.key==='Enter'){const t=e.target;
    if(t&&t.id&&/^[wr]-\d+-\d+$/.test(t.id)){
      const rowEl=t.closest('.sr'),btn=rowEl&&rowEl.querySelector('.ck');
      if(btn){e.preventDefault();btn.click()}}}});
let lastVis=0;
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){flush();return}
  if(!CS)return;
  if(safe){const now=Date.now();if(now-lastVis>20000){lastVis=now;reread()}return}
  if(dirty&&!busy){clearTimeout(sT);save()}});
addEventListener('pagehide',flush);
addEventListener('beforeunload',flush);
addEventListener('error',e=>{try{toast('err','warn','Ошибка: '+String(e.message||'').slice(0,80),5000)}catch(x){}});

/* ---- ЗАПУСК ---- */
let lastDay=today();
function midnight(){const t=today();
  if(t!==lastDay){lastDay=t;if(U.auto)U.date=t;U.wd=null;U.we=false;purge();render(true)}}
function setBoot(text){const e=$('#bs');if(e)e.textContent=text}
async function boot(){
  tgi();theme(false);
  $('#tabbar').innerHTML=TABS.map(x=>`<button data-act="tab" data-t="${x[0]}"${x[0]==='home'?' class="on"':''}>${I(x[2])}${x[1]}</button>`).join('');
  const mir=mirrorRead();
  let st=null,src='';
  if(CS){
    try{
      setBoot('Читаю облако Telegram…');
      const r=await readCloud();
      if(r.state){st=r.state;src='cloud'}
      else if(r.fail){safe=true;src='fail'}
      else{
        setBoot('Ищу данные прежних версий…');
        let L=null;try{L=await legacyScan()}catch(e){}
        const b=blank();b.cfg={...S.cfg};
        if(L)merge(b,L);
        if(mir)merge(b,mir);
        merge(b,localScan());
        const had=b.lib.length||Object.keys(b.days).length;
        if(!had)merge(b,seed());
        st=b;src=had?'mig':'seed'}
    }catch(e){safe=true;lastE=String(e.message||e);src='fail'}
  }
  if(!st){const b=blank();b.cfg={...S.cfg};
    if(mir)merge(b,mir);
    merge(b,localScan());
    if(!b.lib.length&&!Object.keys(b.days).length)merge(b,seed());
    st=b;src=CS?'fail':'local';if(!CS)safe=false}
  S={...S,...st,cfg:{...S.cfg,...(st.cfg||{})}};
  normalize();
  if(!S.rh.length)rebuild();
  const pg=purge(true);
  if(src!=='cloud'||pg)dirty=true;
  theme(false);render();timerRestore();
  const b=$('#boot');if(b){b.classList.add('off');setTimeout(()=>{if(b.parentNode)b.remove()},520)}
  const nd=Object.keys(S.days).length,ne=S.lib.length;
  if(src==='cloud'){setCS('ok');lastJ=JSON.stringify(pack());toast('ok','cloud','Данные из облака на месте')}
  else if(src==='mig')toast('ok','cloud','Данные перенесены: '+nd+' '+pl(nd,'тренировка','тренировки','тренировок')+', '+ne+' '+pl(ne,'упражнение','упражнения','упражнений')+'. Старые ключи не тронуты.');
  else if(src==='seed')toast('ok','cloud','Новый дневник. Список упражнений готов — выбери день в «Программе» или добавь упражнение.');
  else if(src==='fail'){setCS('err');toast('warn','warn','Облако не отдало данные — показана копия с телефона. Запись приостановлена для защиты.',7000);setTimeout(()=>{if(safe)reread()},12000)}
  else if(!CS){setCS('off');toast('warn','warn',oldTG?'Нужен Telegram 6.9+ для облака. Пока данные на телефоне.':'Облако доступно только внутри Telegram. Пока данные на телефоне.',6000)}
  if(pg)toast('warn','trash','Автоочистка: '+pg+' старых заметок перенесено в архив');
  if(dirty&&!safe)plan(900);
  setInterval(midnight,30000);
  setInterval(()=>{if(dirty&&CS&&!safe&&!busy){clearTimeout(sT);save()}},20000)}
boot();
</script>
